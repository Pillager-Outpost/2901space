<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题统计结果 · 2901 Space</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
    :root {
        --bg1: #E0F2FE; --bg2: #F0FDF4;
        --card: rgba(255, 255, 255, 0.9);
        --text: #1E293B; --text-muted: #64748B;
        --border: rgba(203, 213, 225, 0.6);
        --accent: #0EA5E9; --btn-bg: #0EA5E9; --btn-text: #fff;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        --bg-hover: #f8fafc; --input-bg: rgba(255, 255, 255, 0.5);
        --highlight-bg: #BAE6FD; --highlight-text: #0369A1;
        --track: rgba(148, 163, 184, 0.25);
        --err: #c62828; --err-bg: rgba(239, 68, 68, 0.08);
        --t-color: 0.3s ease-out;
    }
    html[data-theme="dark"] {
        --bg1: #0B1120; --bg2: #111827;
        --card: rgba(30, 41, 59, 0.9);
        --text: #E2E8F0; --text-muted: #94A3B8;
        --border: rgba(51, 65, 85, 0.8);
        --accent: #38BDF8; --btn-bg: #38BDF8; --btn-text: #0B1120;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        --bg-hover: #1e293b; --input-bg: rgba(255, 255, 255, 0.06);
        --highlight-bg: #0C4A6E; --highlight-text: #7DD3FC;
        --track: rgba(51, 65, 85, 0.7);
        --err: #f87171; --err-bg: rgba(248, 113, 113, 0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        background: linear-gradient(160deg, var(--bg1), var(--bg2));
        background-attachment: fixed; color: var(--text);
        font-family: "华文中宋", "STZhongsong", "SimSun", serif;
        line-height: 1.8; min-height: 100vh; padding: 88px 20px 48px;
        transition: background var(--t-color), color var(--t-color); overflow-x: hidden;
    }
    .container { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; animation: fadeUp 0.5s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .back-home {
        position: fixed; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 6px;
        padding: 10px 18px; font-size: 0.95em; font-family: inherit; color: var(--text); background: var(--card);
        border: 1px solid var(--border); border-radius: 12px; text-decoration: none; box-shadow: var(--shadow);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        transition: background 0.2s, transform 0.15s, color 0.2s, border-color 0.2s; z-index: 1000;
    }
    .back-home:hover { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); transform: translateY(-2px); }
    #themeToggle {
        position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%;
        border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1.2em;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        box-shadow: var(--shadow); backdrop-filter: blur(8px);
        transition: background 0.2s, transform 0.2s, border-color 0.2s; z-index: 999;
    }
    #themeToggle:hover { transform: scale(1.08); border-color: var(--accent); }
    .card {
        background: var(--card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border); border-radius: 18px; padding: 26px 28px; box-shadow: var(--shadow);
        transition: background var(--t-color), border-color var(--t-color), box-shadow 0.3s;
    }
    .page-header { text-align: center; margin-bottom: 6px; }
    .page-header h1 { font-size: 2em; font-weight: normal; line-height: 1.3; margin-bottom: 4px; }
    .page-header .sub { font-size: 1em; color: var(--text-muted); letter-spacing: 0.04em; }
    .highlight {
        background: var(--highlight-bg); background-repeat: no-repeat; background-size: 100% 40%;
        background-position: 0 88%; padding: 0 8px; color: var(--highlight-text);
        transition: background var(--t-color), color var(--t-color);
    }
    .section-title {
        font-size: 1.05em; font-weight: normal; color: var(--accent); letter-spacing: 0.1em;
        margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;
        flex-wrap: wrap; gap: 10px; transition: color var(--t-color);
    }
    .count-note { font-size: 0.8em; color: var(--text-muted); letter-spacing: 0; }
    .refresh-btn {
        font-size: 0.8em; font-family: inherit; letter-spacing: 0; padding: 4px 12px;
        border-radius: 8px; cursor: pointer; border: 1px solid var(--border);
        background: transparent; color: var(--text-muted);
        transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .refresh-btn:hover { background: var(--bg-hover); color: var(--accent); border-color: var(--accent); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .stats { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .stat-box {
        flex: 1; min-width: 150px; text-align: center; padding: 16px 10px;
        background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px;
    }
    .stat-num { font-size: 1.9em; color: var(--accent); line-height: 1.2; }
    .stat-num.sm { font-size: 1.05em; padding-top: 10px; }
    .stat-label { font-size: 0.9em; color: var(--text-muted); }
    .stat-note { font-size: 0.78em; color: var(--text-muted); margin-top: 2px; }

    /* 错题统计结果行：xx题 · xx人；>5 标红 */
    .q-row {
        display: flex; align-items: center; gap: 12px;
        padding: 8px 10px; border-bottom: 1px dashed var(--border);
        border-left: 3px solid transparent; border-radius: 6px;
    }
    .q-row:last-child { border-bottom: none; }
    .q-row.hot { border-left-color: var(--err); background: var(--err-bg); }
    .q-group { min-width: 76px; font-size: 0.8em; color: var(--text-muted); }
    .q-name { min-width: 70px; font-size: 1em; }
    .q-bar-wrap { flex: 1; height: 12px; background: var(--track); border-radius: 999px; overflow: hidden; }
    .q-bar { height: 100%; background: linear-gradient(90deg, var(--accent), #6366F1); border-radius: 999px; width: 0; transition: width 0.6s ease; }
    .q-row.hot .q-bar { background: linear-gradient(90deg, #f97316, var(--err)); }
    .q-num { min-width: 78px; text-align: right; font-size: 0.92em; color: var(--text-muted); }
    .q-num strong { color: var(--accent); font-size: 1.2em; }
    .q-row.hot .q-num strong { color: var(--err); }
    .q-flag { color: var(--err); font-weight: bold; margin-right: 2px; }

    .student-item { padding: 12px 0; border-bottom: 1px dashed var(--border); }
    .student-item:last-child { border-bottom: none; }
    .student-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .student-name { font-size: 1.02em; color: var(--text); font-weight: bold; }
    .student-time { font-size: 0.82em; color: var(--text-muted); }
    .student-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .student-chip { display: inline-block; padding: 2px 10px; font-size: 0.88em; color: var(--highlight-text); background: var(--highlight-bg); border-radius: 8px; }
    .student-none { font-size: 0.9em; color: var(--text-muted); margin-top: 6px; }

    .empty-hint { font-size: 0.98em; color: var(--text-muted); text-align: center; padding: 28px 0; }
    .denied-card { text-align: center; padding: 48px 28px; }
    .denied-icon { font-size: 3em; display: block; margin-bottom: 12px; }
    .denied-title { font-size: 1.5em; font-weight: normal; margin-bottom: 10px; }
    .denied-desc { color: var(--text-muted); margin-bottom: 24px; }
    .btn-link { display: inline-block; padding: 10px 24px; color: var(--btn-text); background: var(--btn-bg); border-radius: 10px; text-decoration: none; }

    /* ========== 加载中 + 大致进度条 ========== */
    .loading-overlay {
        position: fixed; inset: 0; z-index: 2000;
        background: linear-gradient(160deg, var(--bg1), var(--bg2));
        display: flex; align-items: center; justify-content: center;
        opacity: 0; visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        padding: 24px;
    }
    .loading-overlay.show { opacity: 1; visibility: visible; }
    .loading-box {
        width: min(360px, calc(100vw - 40px));
        background: var(--card);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border); border-radius: 18px;
        padding: 28px 26px; box-shadow: var(--shadow);
        text-align: center;
    }
    .loading-spinner {
        width: 44px; height: 44px; margin: 0 auto 16px;
        border: 4px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: loadingSpin 0.9s linear infinite;
    }
    @keyframes loadingSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .loading-title {
        font-size: 1.25em; font-weight: normal; color: var(--text);
        margin-bottom: 4px;
    }
    .loading-text {
        font-size: 0.9em; color: var(--text-muted);
        min-height: 1.6em;
    }
    .progress-track {
        margin-top: 18px; height: 10px;
        background: var(--track); border-radius: 999px;
        overflow: hidden;
    }
    .progress-bar {
        height: 100%; width: 0;
        background: linear-gradient(90deg, var(--accent), #6366F1);
        border-radius: 999px;
        transition: width 0.35s ease;
    }
    .progress-percent {
        margin-top: 8px; font-size: 0.85em; color: var(--text-muted);
    }

    /* ========== 导出 PDF ========== */
    .export-card { text-align: center; }
    .export-pdf-btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 12px 28px; font-size: 1em; font-family: inherit;
        color: var(--btn-text); background: var(--btn-bg);
        border: none; border-radius: 12px; cursor: pointer;
        box-shadow: 0 6px 18px rgba(14, 165, 233, 0.25);
        transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    .export-pdf-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 26px rgba(14, 165, 233, 0.35);
    }
    .export-pdf-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    .export-note { font-size: 0.85em; color: var(--text-muted); margin-top: 10px; }

    /* 导出瞬间：强制浅色、去动画、去模糊，保证 PDF 干净 */
    body.pdf-exporting,
    body.pdf-exporting * {
        animation: none !important;
        transition: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
    }
    body.pdf-exporting .card {
        background: #ffffff !important;
        box-shadow: none !important;
        border-color: #CBD5E1 !important;
    }
    body.pdf-exporting .refresh-btn,
    body.pdf-exporting .export-pdf-btn,
    body.pdf-exporting .export-note,
    body.pdf-exporting .back-home,
    body.pdf-exporting #themeToggle,
    body.pdf-exporting .loading-overlay { display: none !important; }

    @media (max-width: 600px) {
        body { padding: 76px 14px 32px; }
        .card { padding: 20px 18px; }
        .page-header h1 { font-size: 1.6em; }
        .back-home { top: 12px; left: 12px; padding: 8px 14px; font-size: 0.85em; }
        #themeToggle { top: 12px; right: 12px; width: 38px; height: 38px; font-size: 1em; }
        .q-group { display: none; }
        .q-num { min-width: 74px; font-size: 0.85em; }
        .stat-box { min-width: 130px; }
    }
</style>
</head>
<body>

    <!-- 加载中遮罩 -->
    <div class="loading-overlay show" id="loadingOverlay">
        <div class="loading-box">
            <div class="loading-spinner"></div>
            <div class="loading-title">正在加载结果</div>
            <div class="loading-text" id="loadingText">正在准备…</div>
            <div class="progress-track">
                <div class="progress-bar" id="loadingBar"></div>
            </div>
            <div class="progress-percent" id="loadingPercent">0%</div>
        </div>
    </div>

    <a class="back-home" href="https://pillager-outpost.github.io/2901space/home.html" title="返回用户主页"><span>←</span> 返回</a>
    <button id="themeToggle" title="切换深色/浅色模式">🌙</button>

    <div class="container">

        <div class="card">
            <div class="page-header">
                <h1>📊 <span class="highlight">错题统计结果</span></h1>
                <p class="sub">按提交页（survey.html）的分组与题目顺序展示各题错误人数（&gt; 5 人标红）</p>
            </div>
        </div>

        <div class="card" id="overviewCard">
            <h2 class="section-title">
                <span>📈 概况</span>
                <button class="refresh-btn" id="refreshBtn" title="刷新">🔄 刷新</button>
            </h2>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-num" id="statActive">0.0%</div>
                    <div class="stat-label">统计活跃度</div>
                    <div class="stat-note">统计人数 ÷ 52 · <span id="statActiveNote">0 / 52</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="statAvg">0.00</div>
                    <div class="stat-label">平均错题数</div>
                    <div class="stat-note" id="statAvgNote">共 0 人次勾选</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="statPeople">0</div>
                    <div class="stat-label">统计人数</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num sm" id="statTime">—</div>
                    <div class="stat-label">最后发布</div>
                </div>
            </div>
        </div>

        <div class="card" id="resultCard">
            <h2 class="section-title">
                <span>📋 各题错误人数</span>
                <span class="count-note" id="qCountNote"></span>
            </h2>
            <div id="resultList"></div>
        </div>

        <div class="card">
            <h2 class="section-title">👥 学生明细</h2>
            <div id="detailList"></div>
        </div>

        <div class="card export-card">
            <button class="export-pdf-btn" id="exportPdfBtn">📄 导出结果为 PDF</button>
            <p class="export-note">导出时会自动使用浅色模式，导出完成后恢复当前主题。</p>
        </div>

    </div>

    <!-- PDF 依赖：jsDelivr 优先，失败自动切 unpkg -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js';"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js';"></script>

    <script>
        function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
        function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

        var HOME_URL  = 'https://pillager-outpost.github.io/2901space/home.html';
        var LOGIN_URL = 'https://pillager-outpost.github.io/2901space/login.html';
        var SUPABASE_URL = 'https://htufjnhmowvfocwukrft.supabase.co';
        var ANON_KEY     = 'sb_publishable_X5i03Y12PA5L71QARR9TIw_6FOlJpVr';
        var GET_USER_URL = SUPABASE_URL + '/functions/v1/get_user';
        var SURVEY_URL   = SUPABASE_URL + '/functions/v1/survey';

        var token = safeGet('token');
        var currentUsername = safeGet('username');

        var HOT_THRESHOLD = 5;   // 错误人数 > 5 标红
        var CLASS_TOTAL   = 52;  // 统计活跃度分母：班级总人数

        /* ========== 主题 ========== */
        var root = document.documentElement;
        var themeToggle = document.getElementById('themeToggle');
        function applyTheme(t) { root.setAttribute('data-theme', t); themeToggle.textContent = t === 'dark' ? '☀️' : '🌙'; }
        (function () {
            var s = safeGet('theme');
            if (s !== 'dark' && s !== 'light') {
                try { s = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
                catch (e) { s = 'light'; }
            }
            applyTheme(s);
        })();
        themeToggle.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            applyTheme(next); safeSet('theme', next);
        });

        /* ========== 加载中 + 大致进度 ========== */
        var loadingOverlay = document.getElementById('loadingOverlay');
        var loadingBar = document.getElementById('loadingBar');
        var loadingText = document.getElementById('loadingText');
        var loadingPercent = document.getElementById('loadingPercent');
        var loadProgress = 0;
        var loadingTimer = null;

        function setLoading(p, text) {
            loadProgress = Math.max(loadProgress, Math.min(100, p));
            loadingBar.style.width = loadProgress.toFixed(0) + '%';
            loadingPercent.textContent = loadProgress.toFixed(0) + '%';
            if (text) loadingText.textContent = text;
        }

        function startLoading(text) {
            loadProgress = 0;
            loadingOverlay.classList.add('show');
            loadingBar.style.background = '';
            setLoading(6, text || '正在准备…');

            if (!loadingTimer) {
                loadingTimer = setInterval(function () {
                    if (loadProgress < 88) {
                        setLoading(loadProgress + 1 + Math.random() * 2.5);
                    }
                }, 240);
            }
        }

        function finishLoading() {
            setLoading(100, '加载完成');
            if (loadingTimer) {
                clearInterval(loadingTimer);
                loadingTimer = null;
            }
            setTimeout(function () {
                loadingOverlay.classList.remove('show');
            }, 320);
        }

        function failLoading(text) {
            if (loadingTimer) {
                clearInterval(loadingTimer);
                loadingTimer = null;
            }
            setLoading(100, text || '加载失败');
            loadingBar.style.background = '#ef4444';
            setTimeout(function () {
                loadingOverlay.classList.remove('show');
            }, 850);
        }

        function el(tag, cls, text) {
            var n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text !== undefined) n.textContent = text;
            return n;
        }
        function parseComposite(s) {
            var m = /^(.*)_0(.*)0_$/.exec(s || '');
            return m ? { login: m[1], real: m[2] } : { login: s || '', real: '' };
        }
        function displayNameOf(username) {
            var c = parseComposite(username);
            if (c.login && c.real) return c.login + '（' + c.real + '）';
            return c.login || username || '未知用户';
        }
        function formatTime(s) {
            var d = new Date(s);
            if (isNaN(d.getTime())) return s || '—';
            return d.toLocaleString('zh-CN', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hour12: false
            });
        }
        // 自然排序：4(1) < 4(2) < 10 < 12(3)
        function naturalCompare(a, b) {
            var sa = String(a || ''), sb = String(b || '');
            var re = /(\d+)/;
            while (sa.length && sb.length) {
                var ma = re.exec(sa), mb = re.exec(sb);
                if (!ma || !mb) return sa.localeCompare(sb, 'zh-CN');
                var pa = ma.index, pb = mb.index;
                var ta = sa.slice(0, pa), tb = sb.slice(0, pb);
                if (ta !== tb) return ta.localeCompare(tb, 'zh-CN');
                var na = parseInt(ma[1], 10), nb = parseInt(mb[1], 10);
                if (na !== nb) return na - nb;
                sa = sa.slice(pa + ma[1].length);
                sb = sb.slice(pb + mb[1].length);
            }
            return sa.length - sb.length;
        }
        function showDenied(msg) {
            var container = document.querySelector('.container');
            container.innerHTML = '';
            var card = el('div', 'card denied-card');
            card.appendChild(el('span', 'denied-icon', '🔒'));
            card.appendChild(el('h1', 'denied-title', '无法访问'));
            card.appendChild(el('p', 'denied-desc', msg));
            var a = el('a', 'btn-link', '← 返回用户主页'); a.href = HOME_URL;
            card.appendChild(a);
            container.appendChild(card);
        }
        async function checkAccess() {
            if (!token || !currentUsername) {
                setLoading(10, '正在跳转登录…');
                location.href = LOGIN_URL;
                return false;
            }

            setLoading(14, '正在校验身份…');
            try {
                var res = await fetch(GET_USER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
                    body: JSON.stringify({ username: currentUsername })
                });
                var data = await res.json();
                setLoading(30, '身份校验完成');

                if (res.ok && data.ok && ['teacher', 'admin'].indexOf(data.level) !== -1) return true;
                showDenied('当前页面仅教师 / 管理员可用，你的身份为 ' + (data.level || '未知') + '。');
            } catch (e) {
                setLoading(30, '身份校验失败');
                showDenied('身份校验失败，请刷新重试。');
            }
            return false;
        }

        /* ========== 渲染 ========== */
        var resultList = document.getElementById('resultList');
        var detailList = document.getElementById('detailList');

        // 与 survey.html 保持一致：先按 config.groups 的分组顺序，再按组内 questions 顺序
        function groupIndexOf(item, groups) {
            for (var i = 0; i < groups.length; i++) {
                if (item.group !== undefined && groups[i].id !== undefined &&
                    String(groups[i].id) === String(item.group)) return i;
                if (item.groupName && groups[i].name === item.groupName) return i;
            }
            return groups.length; // 配置里找不到的排到最后
        }
        function questionIndexOf(item, groups, gi) {
            var g = groups[gi];
            var qs = (g && Array.isArray(g.questions)) ? g.questions : [];
            for (var i = 0; i < qs.length; i++) {
                if (String(qs[i]) === String(item.question)) return i;
            }
            return qs.length; // 配置里找不到的排到最后
        }
        function surveyOrderCompare(groups) {
            return function (a, b) {
                var ga = groupIndexOf(a, groups), gb = groupIndexOf(b, groups);
                if (ga !== gb) return ga - gb;
                var qa = questionIndexOf(a, groups, ga), qb = questionIndexOf(b, groups, gb);
                if (qa !== qb) return qa - qb;
                // 兜底：仍是自然题号排序，保证结果稳定
                return naturalCompare(a.question, b.question)
                    || naturalCompare(a.groupName || '', b.groupName || '');
            };
        }

        function renderResults(data) {
            var responses = data.responses || [];
            var summary  = data.summary || [];
            var groups   = (data.config && Array.isArray(data.config.groups)) ? data.config.groups : [];

            var people = data.respondentCount || responses.length || 0;
            var totalSelected = responses.reduce(function (s, r) {
                return s + (Array.isArray(r.selected) ? r.selected.length : 0);
            }, 0);
            var avg = people ? (totalSelected / people) : 0;
            var active = people / CLASS_TOTAL * 100;

            // ===== 概况 =====
            document.getElementById('statPeople').textContent = people;
            document.getElementById('statTime').textContent = formatTime(data.updatedAt);
            document.getElementById('statActive').textContent = active.toFixed(1) + '%';
            document.getElementById('statActiveNote').textContent = people + ' / ' + CLASS_TOTAL;
            document.getElementById('statAvg').textContent = avg.toFixed(2);
            document.getElementById('statAvgNote').textContent = '共 ' + totalSelected + ' 人次勾选';

            // ===== 错题统计结果：按 survey.html 的分组 / 题目顺序 =====
            resultList.innerHTML = '';
            var surveyCompare = surveyOrderCompare(groups);
            // 有配置时按配置顺序排；没有配置就保留接口返回的顺序，不再强行按题号重排
            var items = groups.length ? summary.slice().sort(surveyCompare) : summary.slice();
            document.getElementById('qCountNote').textContent = '共 ' + items.length + ' 题';

            if (!items.length) {
                resultList.appendChild(el('div', 'empty-hint', '管理员还没有发布错题统计，或暂时没有作答数据。'));
            } else {
                items.forEach(function (it) {
                    var hot = it.count > HOT_THRESHOLD;
                    var pct = it.total ? Math.round(it.count / it.total * 100) : 0;

                    var row = el('div', 'q-row' + (hot ? ' hot' : ''));
                    row.appendChild(el('span', 'q-group', it.groupName || ''));
                    row.appendChild(el('span', 'q-name', it.question + ' 题'));

                    var wrap = el('div', 'q-bar-wrap');
                    var bar = el('div', 'q-bar');
                    wrap.appendChild(bar);
                    row.appendChild(wrap);

                    var num = el('span', 'q-num');
                    if (hot) num.appendChild(el('span', 'q-flag', '❗'));
                    num.appendChild(el('strong', '', String(it.count)));
                    num.appendChild(document.createTextNode(' 人'));
                    row.appendChild(num);

                    resultList.appendChild(row);
                    setTimeout(function () { bar.style.width = pct + '%'; }, 50);
                });
            }

            // ===== 学生明细 =====
            detailList.innerHTML = '';
            if (!responses.length) {
                detailList.appendChild(el('div', 'empty-hint', '还没有学生提交。'));
                return;
            }
            responses.forEach(function (r) {
                var item = el('div', 'student-item');
                var head = el('div', 'student-head');
                head.appendChild(el('span', 'student-name', r.displayName || displayNameOf(r.username)));
                head.appendChild(el('span', 'student-time', formatTime(r.submittedAt)));
                item.appendChild(head);

                var selected = Array.isArray(r.selected) ? r.selected : [];
                if (!selected.length) {
                    item.appendChild(el('div', 'student-none', '（本次未勾选薄弱题号）'));
                } else {
                    var chips = el('div', 'student-chips');
                    selected.slice().sort(surveyCompare).forEach(function (s) {
                        var label = s.question;
                        var g = groups.filter(function (x) { return x.id === s.group; })[0];
                        if (g) label = g.name + ' · ' + s.question;
                        chips.appendChild(el('span', 'student-chip', label));
                    });
                    item.appendChild(chips);
                }
                detailList.appendChild(item);
            });
        }

        async function loadResults(isRefresh) {
            if (isRefresh) startLoading('正在刷新…');
            setLoading(46, isRefresh ? '正在刷新统计结果…' : '正在读取统计结果…');

            var refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.disabled = true;
            try {
                var res = await fetch(SURVEY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
                    body: JSON.stringify({ action: 'results', currentUser: currentUsername })
                });
                setLoading(76, '正在接收数据…');

                var data = await res.json().catch(function () { return {}; });
                if (!res.ok || !data.ok) throw new Error(data.msg || ('加载失败：' + res.status));

                setLoading(88, '正在整理数据…');
                renderResults(data);
                return true;
            } catch (err) {
                resultList.innerHTML = '';
                resultList.appendChild(el('div', 'empty-hint', '❌ 加载失败：' + err.message));
                failLoading('加载失败');
                return false;
            } finally {
                refreshBtn.disabled = false;
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', function () {
            loadResults(true).then(function (ok) {
                if (ok) finishLoading();
            });
        });

        /* ========== 导出 PDF（强制浅色） ========== */
        var exportBtn = document.getElementById('exportPdfBtn');

        function sleep(ms) {
            return new Promise(function (resolve) { setTimeout(resolve, ms); });
        }

        async function exportPDF() {
            if (typeof html2canvas !== 'function' || !window.jspdf || !window.jspdf.jsPDF) {
                alert('PDF 组件加载失败，请检查网络后刷新页面再试。');
                return;
            }

            var oldLabel = exportBtn.textContent;
            exportBtn.disabled = true;
            exportBtn.textContent = '⏳ 正在生成 PDF…';

            // 关键：先记住原主题，再强制切到浅色
            var oldTheme = root.getAttribute('data-theme') || 'light';
            root.setAttribute('data-theme', 'light');
            document.body.classList.add('pdf-exporting');

            try {
                // 等两帧，确保浅色变量和隐藏按钮生效
                await new Promise(function (resolve) {
                    requestAnimationFrame(function () {
                        requestAnimationFrame(resolve);
                    });
                });
                await sleep(150);

                // 逐卡片截图：整块放不下就挪到下一页；只有超长卡片才按页裁切
                var cards = Array.prototype.slice.call(document.querySelectorAll('.container > .card'))
                    .filter(function (node) { return window.getComputedStyle(node).display !== 'none'; });

                var pdf = new window.jspdf.jsPDF({
                    orientation: 'portrait',
                    unit: 'pt',
                    format: 'a4',
                    compress: true
                });

                var pageWidth  = pdf.internal.pageSize.getWidth();
                var pageHeight = pdf.internal.pageSize.getHeight();
                var margin = 24;
                var gap = 14;
                var usableW = pageWidth - margin * 2;
                var pageBottom = pageHeight - margin;
                var cursorY = margin;

                var captureOptions = {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false,
                    scrollX: 0,
                    scrollY: -window.scrollY,
                    windowWidth: document.documentElement.scrollWidth,
                    windowHeight: document.documentElement.scrollHeight
                };

                function addCanvasPart(canvas, sy, sh, drawH) {
                    var part = canvas;
                    if (sy > 0 || sh < canvas.height) {
                        part = document.createElement('canvas');
                        part.width = canvas.width;
                        part.height = sh;
                        part.getContext('2d').drawImage(
                            canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh
                        );
                    }
                    pdf.addImage(part.toDataURL('image/jpeg', 0.95), 'JPEG', margin, cursorY, usableW, drawH, undefined, 'FAST');
                    cursorY += drawH;
                }

                for (var i = 0; i < cards.length; i++) {
                    if (!cards[i].getBoundingClientRect().height) continue;

                    var canvas = await html2canvas(cards[i], captureOptions);
                    var imgH = canvas.height * usableW / canvas.width;

                    // 当前页剩余空间不够就换页，避免把卡片从中间撕开
                    if (cursorY > margin && cursorY + imgH > pageBottom + 0.1) {
                        pdf.addPage();
                        cursorY = margin;
                    }

                    if (cursorY + imgH <= pageBottom + 0.1) {
                        addCanvasPart(canvas, 0, canvas.height, imgH);
                        cursorY += gap;
                    } else {
                        // 卡片本身超过一页：逐页裁切，每页只画属于自己的那一段
                        var pxPerPt = canvas.width / usableW;
                        var sy = 0;
                        while (sy < canvas.height) {
                            var availPt = pageBottom - cursorY;
                            var sh = Math.min(canvas.height - sy, Math.floor(availPt * pxPerPt));
                            if (sh <= 0) {
                                pdf.addPage();
                                cursorY = margin;
                                continue;
                            }
                            var drawH = sh / pxPerPt;
                            addCanvasPart(canvas, sy, sh, drawH);
                            sy += sh;
                            if (sy < canvas.height) {
                                pdf.addPage();
                                cursorY = margin;
                            }
                        }
                        cursorY += gap;
                    }
                }

                var d = new Date();
                var stamp = d.getFullYear() +
                    String(d.getMonth() + 1).padStart(2, '0') +
                    String(d.getDate()).padStart(2, '0');
                pdf.save('错题统计结果_' + stamp + '.pdf');
            } catch (e) {
                console.error(e);
                alert('导出失败：' + (e && e.message ? e.message : e));
            } finally {
                // 无论如何都恢复原主题和按钮
                document.body.classList.remove('pdf-exporting');
                root.setAttribute('data-theme', oldTheme);
                exportBtn.disabled = false;
                exportBtn.textContent = oldLabel;
            }
        }

        exportBtn.addEventListener('click', exportPDF);

        /* ========== 初始化 ========== */
        (async function init() {
            startLoading('正在打开结果页…');
            if (!(await checkAccess())) {
                failLoading('身份校验失败');
                return;
            }
            var ok = await loadResults(false);
            if (ok) finishLoading();
        })();
    </script>
</body>
