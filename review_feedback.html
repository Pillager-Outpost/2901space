<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审核结果 · 2901 Space</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
<style>
    :root {
        --bg1: #E0F2FE;
        --bg2: #F0FDF4;
        --card: rgba(255, 255, 255, 0.9);
        --text: #1E293B;
        --text-muted: #64748B;
        --border: rgba(203, 213, 225, 0.6);
        --accent: #0EA5E9;
        --input-bg: #fff;
        --btn-bg: #0EA5E9;
        --btn-text: #fff;
        --error: #DC2626;
        --ok: #16A34A;
        --warn: #D97706;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    html[data-theme="dark"] {
        --bg1: #0B1120;
        --bg2: #111827;
        --card: rgba(30, 41, 59, 0.9);
        --text: #E2E8F0;
        --text-muted: #94A3B8;
        --border: rgba(51, 65, 85, 0.8);
        --accent: #38BDF8;
        --input-bg: #1C2228;
        --btn-bg: #38BDF8;
        --btn-text: #0B1120;
        --error: #F87171;
        --ok: #4ADE80;
        --warn: #FBBF24;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: linear-gradient(160deg, var(--bg1), var(--bg2));
        background-attachment: fixed;
        color: var(--text);
        font-family: "华文中宋", "STZhongsong", "SimSun", serif;
        line-height: 1.8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        transition: background 0.4s, color 0.3s;
    }

    .card {
        background: var(--card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 32px 28px;
        max-width: 420px;
        width: 100%;
        box-shadow: var(--shadow);
        animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .title { text-align: center; font-size: 1.8em; font-weight: normal; margin-bottom: 6px; }
    .subtitle { text-align: center; font-size: 0.95em; color: var(--text-muted); margin-bottom: 28px; }

    label { display: block; font-size: 0.9em; color: var(--text-muted); margin-bottom: 6px; }

    input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        font-size: 1em;
        font-family: inherit;
        color: var(--text);
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        transition: border-color 0.2s;
        margin-bottom: 16px;
    }
    input:focus { border-color: var(--accent); }

    .btn {
        width: 100%;
        padding: 13px 16px;
        font-size: 1.05em;
        font-family: inherit;
        color: var(--btn-text);
        background: var(--btn-bg);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
        box-shadow: 0 4px 14px rgba(14, 165, 233, 0.25);
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .msg { margin-top: 16px; font-size: 0.95em; text-align: center; min-height: 1.6em; line-height: 1.7; }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--ok); }
    .msg.warn { color: var(--warn); }

    .back {
        display: block;
        text-align: center;
        margin-top: 22px;
        font-size: 0.9em;
        color: var(--text-muted);
        text-decoration: none;
        border-bottom: 1px dashed var(--text-muted);
        width: fit-content;
        margin-left: auto;
        margin-right: auto;
    }
    .back:hover { color: var(--accent); border-bottom-color: var(--accent); }

    #themeToggle {
        position: fixed;
        top: 20px; right: 20px;
        width: 44px; height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 1.2em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow);
        transition: transform 0.2s;
        z-index: 999;
    }
    #themeToggle:hover { transform: scale(1.08); }

    @media (max-width: 600px) {
        .card { padding: 24px 18px; }
        .title { font-size: 1.5em; }
        #themeToggle { top: 14px; right: 14px; width: 38px; height: 38px; font-size: 1em; }
    }
</style>
</head>
<body>

    <button id="themeToggle" title="切换深色/浅色模式">🌙</button>

    <div class="card">
        <h1 class="title">审核结果</h1>
        <p class="subtitle">输入注册时的用户名和真实姓名查询</p>

        <label for="username">用户名</label>
        <input type="text" id="username" placeholder="注册时填的用户名" autocomplete="off">

        <label for="realname">真实姓名</label>
        <input type="text" id="realname" placeholder="注册时填的真实姓名" autocomplete="off">

        <button class="btn" id="queryBtn" type="button">查询</button>

        <p class="msg" id="msg"></p>

        <a class="back" href="https://pillager-outpost.github.io/2901space/">← 返回首页</a>
    </div>

    <script>
        // 主题
        function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
        function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

        var themeToggle = document.getElementById('themeToggle');
        var root = document.documentElement;
        function applyTheme(t) {
            root.setAttribute('data-theme', t);
            if (themeToggle) themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
        }
        function getInitialTheme() {
            var s = safeGet('theme');
            if (s === 'dark' || s === 'light') return s;
            try { return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
            catch(e){ return 'light'; }
        }
        applyTheme(getInitialTheme());
        if (themeToggle) {
            themeToggle.addEventListener('click', function () {
                var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                applyTheme(next);
                safeSet('theme', next);
            });
        }

        // 查询
        var SUPABASE_URL = 'https://htufjnhmowvfocwukrft.supabase.co';
        var FUNCTION_URL = SUPABASE_URL + '/functions/v1/check_review';
        var SUPABASE_ANON_KEY = 'sb_publishable_X5i03Y12PA5L71QARR9TIw_6FOlJpVr';
        var LOGIN_URL = 'https://pillager-outpost.github.io/2901space/login.html';

        var usernameEl = document.getElementById('username');
        var realnameEl = document.getElementById('realname');
        var queryBtn = document.getElementById('queryBtn');
        var msg = document.getElementById('msg');

        function showMsg(text, type) {
            msg.textContent = text;
            msg.className = 'msg ' + (type || '');
        }

        queryBtn.addEventListener('click', async function () {
            var username = usernameEl.value.trim();
            var realname = realnameEl.value.trim();

            if (!username) { showMsg('请输入用户名', 'error'); return; }
            if (!realname) { showMsg('请输入真实姓名', 'error'); return; }

            queryBtn.disabled = true;
            showMsg('查询中…', '');

            try {
                var res = await fetch(FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({
                        username: username,
                        realname: realname
                    })
                });

                var data = await res.json().catch(function () { return {}; });

                if (!res.ok) {
                    showMsg(data.error || ('查询失败：' + res.status), 'error');
                    return;
                }

                if (data.status === 'pending') {
                    showMsg('等待审核中，请耐心等候。', 'warn');
                } else if (data.status === 'approved') {
                    showMsg('审核成功！2.5 秒后跳转到登录页…', 'ok');
                    setTimeout(function () {
                        window.location.href = LOGIN_URL;
                    }, 2500);
                } else {
                    showMsg('未知状态，请稍后重试。', 'error');
                }
            } catch (e) {
                console.error(e);
                showMsg('网络错误，请稍后重试', 'error');
            } finally {
                queryBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
