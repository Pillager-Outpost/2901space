<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题统计 · 2901 Space</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
    :root {
        --bg1: #E0F2FE; --bg2: #F0FDF4;
        --card: rgba(255, 255, 255, 0.9);
        --text: #1E293B; --text-muted: #64748B;
        --border: rgba(203, 213, 225, 0.6);
        --accent: #0EA5E9; --btn-bg: #0EA5E9; --btn-text: #fff;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        --shadow-hover: 0 12px 32px rgba(14, 165, 233, 0.15);
        --bg-hover: #f8fafc; --input-bg: rgba(255, 255, 255, 0.5);
        --highlight-bg: #BAE6FD; --highlight-text: #0369A1;
        --ok: #0a7d32; --err: #c62828; --t-color: 0.3s ease-out;
    }
    html[data-theme="dark"] {
        --bg1: #0B1120; --bg2: #111827;
        --card: rgba(30, 41, 59, 0.9);
        --text: #E2E8F0; --text-muted: #94A3B8;
        --border: rgba(51, 65, 85, 0.8);
        --accent: #38BDF8; --btn-bg: #38BDF8; --btn-text: #0B1120;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        --shadow-hover: 0 12px 32px rgba(56, 189, 248, 0.2);
        --bg-hover: #1e293b; --input-bg: rgba(255, 255, 255, 0.06);
        --highlight-bg: #0C4A6E; --highlight-text: #7DD3FC; --ok: #4ade80; --err: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        background: linear-gradient(160deg, var(--bg1), var(--bg2));
        background-attachment: fixed; color: var(--text);
        font-family: "华文中宋", "STZhongsong", "SimSun", serif;
        line-height: 1.8; min-height: 100vh; padding: 88px 20px 48px;
        transition: background var(--t-color), color var(--t-color); overflow-x: hidden;
    }
    .container { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; animation: fadeUp 0.5s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .back-home {
        position: fixed; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 6px;
        padding: 10px 18px; font-size: 0.95em; font-family: inherit; color: var(--text); background: var(--card);
        border: 1px solid var(--border); border-radius: 12px; text-decoration: none; box-shadow: var(--shadow);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        transition: background 0.2s, transform 0.15s, color 0.2s, border-color 0.2s; z-index: 1000;
    }
    .back-home:hover { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); transform: translateY(-2px); }
    #themeToggle {
        position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%;
        border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1.2em;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        box-shadow: var(--shadow); backdrop-filter: blur(8px);
        transition: background 0.2s, transform 0.2s, border-color 0.2s; z-index: 999;
    }
    #themeToggle:hover { transform: scale(1.08); border-color: var(--accent); }
    .card {
        background: var(--card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border); border-radius: 18px; padding: 26px 28px; box-shadow: var(--shadow);
        transition: background var(--t-color), border-color var(--t-color), box-shadow 0.3s;
    }
    .page-header { text-align: center; margin-bottom: 6px; }
    .page-header h1 { font-size: 2em; font-weight: normal; line-height: 1.3; margin-bottom: 4px; }
    .page-header .sub { font-size: 1em; color: var(--text-muted); letter-spacing: 0.04em; }
    .highlight {
        background: var(--highlight-bg); background-repeat: no-repeat; background-size: 100% 40%;
        background-position: 0 88%; padding: 0 8px; color: var(--highlight-text);
        transition: background var(--t-color), color var(--t-color);
    }
    .section-title {
        font-size: 1.05em; font-weight: normal; color: var(--accent); letter-spacing: 0.1em;
        margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;
        flex-wrap: wrap; gap: 10px; transition: color var(--t-color);
    }
    .group-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .group-title { margin-bottom: 0; }
    .group-actions { display: flex; gap: 8px; }
    .mini-btn {
        font-size: 0.78em; font-family: inherit; letter-spacing: 0; padding: 3px 12px;
        border-radius: 8px; cursor: pointer; border: 1px solid var(--border);
        background: transparent; color: var(--text-muted);
        transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .mini-btn:hover { background: var(--bg-hover); color: var(--accent); border-color: var(--accent); }
    .q-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .q-chip { position: relative; cursor: pointer; -webkit-user-select: none; user-select: none; }
    .q-chip input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
    .q-label {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 58px; padding: 8px 14px; font-size: 1em; font-family: inherit; line-height: 1.2;
        color: var(--text); background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px;
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        transition: transform 0.15s, border-color 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s;
    }
    .q-chip:hover .q-label { border-color: var(--accent); transform: translateY(-2px); }
    .q-chip input:checked + .q-label {
        background: var(--accent); color: var(--btn-text); border-color: var(--accent);
        box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3);
    }
    .q-chip input:checked + .q-label::before { content: '✓ '; }
    .q-chip input:focus-visible + .q-label { outline: 2px solid var(--accent); outline-offset: 2px; }
    html[data-theme="dark"] .q-chip input:checked + .q-label { box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3); }
    .empty-hint { font-size: 0.95em; color: var(--text-muted); padding: 12px 0; text-align: center; }
    .submit-bar {
        display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
        position: sticky; bottom: 16px; z-index: 10;
    }
    .selected-count { font-size: 1em; color: var(--text-muted); }
    .selected-count strong { color: var(--accent); font-size: 1.35em; padding: 0 4px; }
    .submit-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .clear-btn {
        padding: 11px 20px; font-size: 0.98em; font-family: inherit; color: var(--text); background: transparent;
        border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
        transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .clear-btn:hover { background: var(--bg-hover); border-color: var(--accent); transform: translateY(-2px); }
    .submit-btn {
        display: inline-flex; align-items: center; gap: 8px; padding: 11px 26px; font-size: 1em;
        font-family: inherit; color: var(--btn-text); background: var(--btn-bg); border: none;
        border-radius: 10px; cursor: pointer; box-shadow: 0 4px 14px rgba(14, 165, 233, 0.25);
        transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(14, 165, 233, 0.35); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .saved-tip { font-size: 0.9em; color: var(--ok); text-align: center; }

    /* ========== 自由发挥区（内嵌公共画布） ========== */
    .canvas-status {
        display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
        font-size: 0.95em; color: var(--text-muted); margin-bottom: 12px; text-align: center;
    }
    .canvas-preview {
        display: block; width: 100%; max-width: 480px; margin: 0 auto 12px;
        border: 1px solid var(--border); border-radius: 12px;
    }
    .canvas-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .canvas-tool-label { font-size: 0.85em; color: var(--text-muted); }
    .swatch {
        width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent;
        cursor: pointer; transition: transform 0.15s, border-color 0.2s;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.active { border-color: var(--text); transform: scale(1.12); }
    input[type="color"] { width: 30px; height: 30px; padding: 0; border: none; background: transparent; cursor: pointer; }
    input[type="range"] { width: 100px; accent-color: var(--accent); }
    .tool-btn {
        font-size: 0.78em; font-family: inherit; padding: 5px 12px; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--border); background: transparent; color: var(--text-muted);
        transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .tool-btn:hover, .tool-btn.active { background: var(--accent); color: var(--btn-text); border-color: var(--accent); }
    .canvas-wrap {
        width: 100%; aspect-ratio: 3 / 2; border: 1px solid var(--border); border-radius: 12px;
        overflow: hidden; background-color: #fff;
        background-image: linear-gradient(0deg, #eef2f7 1px, transparent 1px), linear-gradient(90deg, #eef2f7 1px, transparent 1px);
        background-size: 24px 24px;
    }
    #board { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    .canvas-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .inline-msg { font-size: 0.88em; color: var(--err); min-height: 1.4em; margin-top: 8px; }
    .inline-msg.ok { color: var(--ok); }

    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        display: none; align-items: center; justify-content: center; z-index: 2000;
        opacity: 0; transition: opacity 0.3s ease; padding: 24px;
    }
    .modal-overlay.show { display: flex; opacity: 1; }
    .modal-box {
        background: var(--card); border: 1px solid var(--border); border-radius: 18px;
        padding: 28px 24px; width: 100%; max-width: 440px; text-align: center; box-shadow: var(--shadow-hover);
        animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); max-height: 85vh; overflow-y: auto;
    }
    @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-emoji { font-size: 2.4em; display: block; margin-bottom: 10px; }
    .modal-title { font-size: 1.3em; font-weight: normal; color: var(--accent); margin-bottom: 6px; }
    .modal-desc { font-size: 0.95em; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }
    .modal-desc a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); }
    .modal-desc a:hover { border-bottom-style: solid; }
    .result-body { text-align: left; margin-bottom: 20px; }
    .result-group { margin-bottom: 14px; }
    .result-group-name { font-size: 0.98em; color: var(--text); font-weight: bold; margin-bottom: 6px; }
    .result-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .result-chip { display: inline-block; padding: 2px 10px; font-size: 0.9em; color: var(--highlight-text); background: var(--highlight-bg); border-radius: 8px; }
    .egg-code-row {
        display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 24px;
    }
    .egg-code {
        font-family: "Consolas", "Courier New", monospace;
        font-size: 1em; color: var(--text);
        background: var(--bg-hover); padding: 8px 16px;
        border-radius: 10px; border: 1px dashed var(--accent); user-select: all;
    }
    .modal-btn {
        padding: 11px 24px; font-size: 1em; font-family: inherit; color: var(--btn-text);
        background: var(--btn-bg); border: none; border-radius: 10px; cursor: pointer; width: 100%;
        transition: transform 0.15s;
    }
    .modal-btn:hover { transform: translateY(-2px); }
    .denied-card { text-align: center; padding: 48px 28px; }
    .denied-icon { font-size: 3em; display: block; margin-bottom: 12px; }
    .denied-title { font-size: 1.5em; font-weight: normal; margin-bottom: 10px; }
    .denied-desc { color: var(--text-muted); margin-bottom: 24px; }
    .btn-link { display: inline-block; padding: 10px 24px; color: var(--btn-text); background: var(--btn-bg); border-radius: 10px; text-decoration: none; }
    @media (max-width: 600px) {
        body { padding: 76px 14px 32px; }
        .card { padding: 20px 18px; }
        .page-header h1 { font-size: 1.6em; }
        .back-home { top: 12px; left: 12px; padding: 8px 14px; font-size: 0.85em; }
        #themeToggle { top: 12px; right: 12px; width: 38px; height: 38px; font-size: 1em; }
        .submit-bar { position: static; }
        .submit-actions { width: 100%; }
        .submit-btn, .clear-btn { flex: 1; justify-content: center; }
        input[type="range"] { width: 80px; }
    }
</style>
</head>
<body>

    <a class="back-home" href="https://pillager-outpost.github.io/2901space/home.html" title="返回用户主页"><span>←</span> 返回</a>
    <button id="themeToggle" title="切换深色/浅色模式">🌙</button>

    <div class="container">

        <div class="card">
            <div class="page-header">
                <h1>📚 <span class="highlight">生物错题统计</span></h1>
                <p class="sub">勾选你薄弱的题号，帮助老师定位薄弱环节</p>
            </div>
        </div>

        <div id="surveyGroups"></div>

        <!-- 自由发挥区：内嵌公共画布 -->
        <div class="card" id="canvasCard">
            <h2 class="section-title">🎨 自由发挥区</h2>
            <div class="canvas-status" id="canvasStatusBox">
                <span id="canvasStatusIcon">⏳</span>
                <span id="canvasStatusText">正在查看画布…</span>
                <button type="button" class="mini-btn" id="canvasEnterBtn" style="display:none;">✏️ 开始创作</button>
                <button type="button" class="mini-btn" id="canvasRetryBtn" style="display:none;">🔄 重试</button>
            </div>
            <img id="canvasPreview" class="canvas-preview" alt="当前画布作品" style="display:none;">

            <div id="canvasEditor" style="display:none;">
                <div class="canvas-toolbar">
                    <span class="canvas-tool-label">颜色</span>
                    <span class="swatch active" data-color="#1E293B" style="background:#1E293B;"></span>
                    <span class="swatch" data-color="#0EA5E9" style="background:#0EA5E9;"></span>
                    <span class="swatch" data-color="#EF4444" style="background:#EF4444;"></span>
                    <span class="swatch" data-color="#22C55E" style="background:#22C55E;"></span>
                    <span class="swatch" data-color="#F59E0B" style="background:#F59E0B;"></span>
                    <input type="color" id="customCanvasColor" value="#1E293B" title="自定义颜色">
                    <span class="canvas-tool-label">粗细</span>
                    <input type="range" id="canvasBrushSize" min="1" max="30" value="2">
                    <button type="button" class="tool-btn" id="canvasEraserBtn">🧽 橡皮</button>
                </div>
                <div class="canvas-wrap"><canvas id="board"></canvas></div>
                <div class="canvas-actions">
                    <button type="button" class="submit-btn" id="canvasSaveBtn">💾 保存画作</button>
                    <button type="button" class="clear-btn" id="canvasGiveUpBtn">放弃修改</button>
                </div>
                <div class="inline-msg" id="canvasMsg"></div>
            </div>
        </div>

        <div class="card submit-bar" id="submitBar">
            <span class="selected-count">已选 <strong id="selectedCount">0</strong> 题</span>
            <div class="submit-actions">
                <button type="button" class="clear-btn" id="clearBtn">清空</button>
                <button type="button" class="submit-btn" id="submitBtn" disabled>📤 提交统计</button>
            </div>
        </div>
        <div class="saved-tip" id="savedTip" style="display:none;"></div>

    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-box">
            <span class="modal-emoji">✅</span>
            <h2 class="modal-title">提交成功</h2>
            <p class="modal-desc" id="resultDesc">以下是你勾选的薄弱题号：</p>
            <div class="result-body" id="resultBody"></div>
            <button class="modal-btn" id="closeResultBtn">知道了</button>
        </div>
    </div>

    <!-- 彩蛋 7 弹窗 -->
    <div class="modal-overlay" id="egg7Modal">
        <div class="modal-box">
            <span class="modal-emoji" id="egg7Emoji">📖</span>
            <h2 class="modal-title">恭喜获得彩蛋 #7</h2>
            <p class="modal-desc" id="egg7Desc">
                这么用功，真是刻苦学习！这是你的专属兑换码，请前往 <a href="https://pillager-outpost.github.io/2901space/eggs.html" target="_blank">eggs.html</a> 兑换：<br>
                集齐 9 个彩蛋会触发神秘事件！
            </p>
            <div class="egg-code-row">
                <code class="egg-code" id="egg7Code">studyveryhard</code>
                <button class="clear-btn" style="padding:6px 12px;" id="copyEgg7Btn">复制</button>
            </div>
            <button class="submit-btn" style="width:100%;justify-content:center;" id="closeEgg7Btn">收下彩蛋</button>
        </div>
    </div>

    <script>
        function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
        function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

        var HOME_URL  = 'https://pillager-outpost.github.io/2901space/home.html';
        var LOGIN_URL = 'https://pillager-outpost.github.io/2901space/login.html';
        var SUPABASE_URL = 'https://htufjnhmowvfocwukrft.supabase.co';
        var ANON_KEY     = 'sb_publishable_X5i03Y12PA5L71QARR9TIw_6FOlJpVr';
        var GET_USER_URL = SUPABASE_URL + '/functions/v1/get_user';
        var SURVEY_URL   = SUPABASE_URL + '/functions/v1/survey';
        var CANVAS_URL   = SUPABASE_URL + '/functions/v1/canvas';

        var token = safeGet('token');
        var currentUsername = safeGet('username');
        var displayName = safeGet('displayName') || '';

        /* ========== 主题 ========== */
        var root = document.documentElement;
        var themeToggle = document.getElementById('themeToggle');
        function applyTheme(t) { root.setAttribute('data-theme', t); themeToggle.textContent = t === 'dark' ? '☀️' : '🌙'; }
        (function () {
            var s = safeGet('theme');
            if (s !== 'dark' && s !== 'light') {
                try { s = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
                catch (e) { s = 'light'; }
            }
            applyTheme(s);
        })();
        themeToggle.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            applyTheme(next); safeSet('theme', next);
        });

        function el(tag, cls, text) {
            var n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text !== undefined) n.textContent = text;
            return n;
        }
        function parseComposite(s) {
            var m = /^(.*)_0(.*)0_$/.exec(s || '');
            return m ? { login: m[1], real: m[2] } : { login: s || '', real: '' };
        }
        function displayNameOf(username) {
            var c = parseComposite(username);
            if (c.login && c.real) return c.login + '（' + c.real + '）';
            return c.login || username || '未知用户';
        }
        function showDenied(msg) {
            var container = document.querySelector('.container');
            container.innerHTML = '';
            var card = el('div', 'card denied-card');
            card.appendChild(el('span', 'denied-icon', '🔒'));
            card.appendChild(el('h1', 'denied-title', '无法访问'));
            card.appendChild(el('p', 'denied-desc', msg));
            var a = el('a', 'btn-link', '← 返回用户主页'); a.href = HOME_URL;
            card.appendChild(a);
            container.appendChild(card);
        }
        async function checkAccess() {
            if (!token || !currentUsername) { location.href = LOGIN_URL; return false; }
            try {
                var res = await fetch(GET_USER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
                    body: JSON.stringify({ username: currentUsername })
                });
                var data = await res.json();
                if (res.ok && data.ok && ['student', 'admin'].indexOf(data.level) !== -1) return true;
                showDenied('当前页面仅学生 / 管理员可用，你的身份为 ' + (data.level || '未知') + '。');
            } catch (e) { showDenied('身份校验失败，请刷新重试。'); }
            return false;
        }
        function apiCall(body) {
            return fetch(SURVEY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
                body: JSON.stringify(body)
            });
        }
        function canvasApi(body) {
            return fetch(CANVAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
                body: JSON.stringify(body)
            }).then(function (r) { return r.json().catch(function () { return {}; }); });
        }

        /* ========== 问卷部分 ========== */
        var SURVEY_DATA = { title: '生物错题统计', groups: [] };
        var hasSubmitted = false;

        var surveyGroups = document.getElementById('surveyGroups');
        var selectedCount = document.getElementById('selectedCount');
        var submitBtn = document.getElementById('submitBtn');
        var savedTip = document.getElementById('savedTip');

        function updateCount() {
            var n = document.querySelectorAll('.q-chip input:checked').length;
            selectedCount.textContent = n;
            submitBtn.disabled = (SURVEY_DATA.groups.length === 0);
        }

        function renderSurvey() {
            surveyGroups.innerHTML = '';
            if (!SURVEY_DATA.groups.length) {
                var c = el('div', 'card');
                c.appendChild(el('div', 'empty-hint', '管理员还没有发布错题统计，请稍后再来～'));
                surveyGroups.appendChild(c);
                updateCount(); return;
            }
            SURVEY_DATA.groups.forEach(function (group) {
                var card = el('div', 'card');
                var head = el('div', 'group-head');
                head.appendChild(el('h2', 'section-title group-title', '📖 ' + group.name));
                var actions = el('div', 'group-actions');
                var allBtn = el('button', 'mini-btn', '全选');
                allBtn.type = 'button';
                allBtn.addEventListener('click', function () { setGroupChecked(group.id, true); });
                var noneBtn = el('button', 'mini-btn', '清空');
                noneBtn.type = 'button';
                noneBtn.addEventListener('click', function () { setGroupChecked(group.id, false); });
                actions.appendChild(allBtn); actions.appendChild(noneBtn);
                head.appendChild(actions); card.appendChild(head);

                var grid = el('div', 'q-grid');
                group.questions.forEach(function (q) {
                    var label = el('label', 'q-chip');
                    var input = document.createElement('input');
                    input.type = 'checkbox'; input.value = q;
                    input.setAttribute('data-group', group.id);
                    input.setAttribute('data-q', q);
                    input.addEventListener('change', updateCount);
                    label.appendChild(input);
                    label.appendChild(el('span', 'q-label', q));
                    grid.appendChild(label);
                });
                card.appendChild(grid);
                surveyGroups.appendChild(card);
            });
            updateCount();
        }

        function setGroupChecked(groupId, checked) {
            var inputs = document.querySelectorAll('.q-chip input[data-group="' + groupId + '"]');
            for (var i = 0; i < inputs.length; i++) inputs[i].checked = checked;
            updateCount();
        }
        function applySelection(selected) {
            var list = Array.isArray(selected) ? selected : [];
            var inputs = document.querySelectorAll('.q-chip input');
            for (var i = 0; i < inputs.length; i++) {
                var g = inputs[i].getAttribute('data-group');
                var q = inputs[i].getAttribute('data-q');
                inputs[i].checked = list.some(function (s) { return s.group === g && s.question === q; });
            }
            updateCount();
        }

        document.getElementById('clearBtn').addEventListener('click', function () {
            var inputs = document.querySelectorAll('.q-chip input');
            for (var i = 0; i < inputs.length; i++) inputs[i].checked = false;
            updateCount();
        });

        async function loadConfig() {
            try {
                var res = await apiCall({ action: 'get_config', currentUser: currentUsername });
                var data = await res.json();
                if (res.ok && data.ok && data.data && Array.isArray(data.data.groups)) {
                    SURVEY_DATA = data.data;
                }
            } catch (e) {}
            renderSurvey();
        }

        async function loadMyResponse() {
            try {
                var res = await apiCall({ action: 'my_response', currentUser: currentUsername });
                var data = await res.json();
                if (res.ok && data.ok) {
                    if (data.submittedAt) {
                        hasSubmitted = true;
                        submitBtn.textContent = '💾 更新提交';
                        savedTip.style.display = 'block';
                        savedTip.textContent = '你已提交过，更新后会覆盖原记录。';
                    }
                    applySelection(data.selected || []);
                }
            } catch (e) {}
        }

        var resultModal = document.getElementById('resultModal');
        var resultBody = document.getElementById('resultBody');
        function closeResult() { resultModal.classList.remove('show'); }
        document.getElementById('closeResultBtn').addEventListener('click', closeResult);
        resultModal.addEventListener('click', function (e) { if (e.target === resultModal) closeResult(); });

        /* ========== 自由发挥区：内嵌画布 ========== */
        var canvasToken = '';
        var canvasHeartbeat = null;

        var statusIcon = document.getElementById('canvasStatusIcon');
        var statusText = document.getElementById('canvasStatusText');
        var enterBtn = document.getElementById('canvasEnterBtn');
        var retryBtn = document.getElementById('canvasRetryBtn');
        var previewImg = document.getElementById('canvasPreview');
        var editorBox = document.getElementById('canvasEditor');

        function canvasSetStatus(icon, text, showEnter, showRetry) {
            statusIcon.textContent = icon;
            statusText.textContent = text;
            enterBtn.style.display = showEnter ? 'inline-block' : 'none';
            retryBtn.style.display = showRetry ? 'inline-block' : 'none';
        }
        function canvasSetMsg(text, ok) {
            var m = document.getElementById('canvasMsg');
            m.textContent = text || '';
            m.className = 'inline-msg' + (ok ? ' ok' : '');
        }

        var board = document.getElementById('board');
        var bctx = board.getContext('2d');
        board.width = 1200; board.height = 800;
        var drawing = false, lastPt = null;
        var brushColor = '#1E293B', brushWidth = 2, erasing = false;

        function applyBrush() {
            bctx.lineCap = 'round'; bctx.lineJoin = 'round';
            bctx.lineWidth = brushWidth;
            bctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
            bctx.strokeStyle = erasing ? 'rgba(0,0,0,1)' : brushColor;
            bctx.fillStyle = bctx.strokeStyle;
        }
        applyBrush();

        function boardPos(e) {
            var r = board.getBoundingClientRect();
            return {
                x: (e.clientX - r.left) / r.width * board.width,
                y: (e.clientY - r.top) / r.height * board.height
            };
        }
        board.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            drawing = true; lastPt = boardPos(e);
            try { board.setPointerCapture(e.pointerId); } catch (err) {}
            applyBrush();
            bctx.beginPath();
            bctx.arc(lastPt.x, lastPt.y, brushWidth / 2, 0, Math.PI * 2);
            bctx.fill();
        });
        board.addEventListener('pointermove', function (e) {
            if (!drawing) return;
            var p = boardPos(e);
            bctx.beginPath();
            bctx.moveTo(lastPt.x, lastPt.y);
            bctx.lineTo(p.x, p.y);
            bctx.stroke();
            lastPt = p;
        });
        function endBoardDraw() { drawing = false; lastPt = null; }
        board.addEventListener('pointerup', endBoardDraw);
        board.addEventListener('pointercancel', endBoardDraw);

        var swatches = document.querySelectorAll('.swatch');
        swatches.forEach(function (s) {
            s.addEventListener('click', function () {
                swatches.forEach(function (x) { x.classList.remove('active'); });
                s.classList.add('active');
                brushColor = s.getAttribute('data-color');
                erasing = false;
                document.getElementById('canvasEraserBtn').classList.remove('active');
                applyBrush();
            });
        });
        document.getElementById('customCanvasColor').addEventListener('input', function (e) {
            brushColor = e.target.value;
            erasing = false;
            document.getElementById('canvasEraserBtn').classList.remove('active');
            applyBrush();
        });
        document.getElementById('canvasBrushSize').addEventListener('input', function (e) {
            brushWidth = parseInt(e.target.value, 10) || 2;
            applyBrush();
        });
        document.getElementById('canvasEraserBtn').addEventListener('click', function () {
            erasing = !erasing;
            this.classList.toggle('active', erasing);
            applyBrush();
        });

        function exportBoardImage() {
            var tmp = document.createElement('canvas');
            tmp.width = board.width; tmp.height = board.height;
            var t = tmp.getContext('2d');
            t.fillStyle = '#ffffff';
            t.fillRect(0, 0, tmp.width, tmp.height);
            t.drawImage(board, 0, 0);
            return tmp.toDataURL('image/webp', 0.85);
        }
        function loadBoardImage(src, cb) {
            if (!src) { cb(); return; }
            var img = new Image();
            img.onload = function () {
                bctx.globalCompositeOperation = 'source-over';
                bctx.drawImage(img, 0, 0, board.width, board.height);
                applyBrush();
                cb();
            };
            img.onerror = cb;
            img.src = src;
        }

        function startCanvasHeartbeat() {
            stopCanvasHeartbeat();
            canvasHeartbeat = setInterval(async function () {
                if (!canvasToken) return;
                var r = await canvasApi({ action: 'renew', currentUser: currentUsername, token: canvasToken });
                if (!r.ok || !r.granted) {
                    stopCanvasHeartbeat();
                    canvasToken = '';
                    editorBox.style.display = 'none';
                    canvasSetStatus('⏰', '你的绘画时间到了，请重新进入。', false, true);
                }
            }, 60000);
        }
        function stopCanvasHeartbeat() {
            if (canvasHeartbeat) { clearInterval(canvasHeartbeat); canvasHeartbeat = null; }
        }
        async function releaseCanvas() {
            stopCanvasHeartbeat();
            if (!canvasToken) return;
            var t = canvasToken; canvasToken = '';
            try {
                await canvasApi({ action: 'release', currentUser: currentUsername, token: t });
            } catch (e) {}
        }

        // 自动保存画布：供「保存画作」和提交统计共用
        async function saveCanvas(auto) {
            if (!canvasToken) return { saved: false, err: '' };
            try {
                var r = await canvasApi({
                    action: 'upload',
                    currentUser: currentUsername,
                    token: canvasToken,
                    image: exportBoardImage()
                });
                if (!r.ok) throw new Error(r.msg || '画作保存失败');
                canvasToken = '';
                stopCanvasHeartbeat();
                editorBox.style.display = 'none';
                var d = await canvasApi({ action: 'state' });
                if (d.ok && d.image) { previewImg.src = d.image; previewImg.style.display = 'block'; }
                if (!auto) canvasSetStatus('✅', '作品已保存，其他同学现在可以创作了。', false, false);
                return { saved: true, err: '' };
            } catch (err) {
                if (!auto) canvasSetMsg('❌ ' + err.message + '（你的画作还在，可重试）');
                return { saved: false, err: err.message };
            }
        }

        function enterCanvasEditor(token, image) {
            canvasToken = token;
            canvasSetStatus('', '', false, false);
            editorBox.style.display = 'block';
            canvasSetMsg('你现在可以画画了，其他人暂时无法进入。保存画作或提交统计后，别人就能进入。', true);
            loadBoardImage(image, startCanvasHeartbeat);
        }

        function busyText(holder, name) {
            if (holder === currentUsername) return '你已在另一个窗口打开画布，请先关闭。';
            return '画布正在被 ' + (name || '某位同学') + ' 使用，稍后再试。';
        }

        async function initCanvas() {
            canvasSetStatus('⏳', '正在查看画布…', false, false);
            editorBox.style.display = 'none';
            try {
                var d = await canvasApi({ action: 'state' });
                if (!d.ok) throw new Error(d.msg || '加载失败');
                if (d.image) { previewImg.src = d.image; previewImg.style.display = 'block'; }
                else { previewImg.style.display = 'none'; }

                if (d.status === 'busy') {
                    canvasSetStatus('🔒', busyText(d.holder, d.holderName), false, true);
                    return;
                }
                canvasSetStatus('✨', '画布空闲，点击下方开始创作。', true, false);
            } catch (err) {
                canvasSetStatus('❌', '画布状态加载失败：' + err.message, false, true);
            }
        }

        enterBtn.addEventListener('click', async function () {
            enterBtn.disabled = true;
            canvasSetStatus('⏳', '正在进入画布…', false, false);
            try {
                var d = await canvasApi({ action: 'state' });
                if (!d.ok) throw new Error(d.msg || '加载失败');
                if (d.status === 'busy') {
                    canvasSetStatus('🔒', busyText(d.holder, d.holderName), false, true);
                    return;
                }
                var r = await canvasApi({
                    action: 'acquire',
                    currentUser: currentUsername,
                    displayName: displayName || displayNameOf(currentUsername)
                });
                if (!r.ok) throw new Error(r.msg || '进入画布失败');
                if (!r.granted) {
                    canvasSetStatus('🔒', busyText(r.holder, r.holderName), false, true);
                    return;
                }
                enterCanvasEditor(r.token, d.image);
            } catch (err) {
                canvasSetStatus('❌', '进入画布失败：' + err.message, false, true);
            } finally {
                enterBtn.disabled = false;
            }
        });

        retryBtn.addEventListener('click', initCanvas);

        document.getElementById('canvasSaveBtn').addEventListener('click', function () { saveCanvas(false); });

        document.getElementById('canvasGiveUpBtn').addEventListener('click', async function () {
            await releaseCanvas();
            initCanvas();
        });

        window.addEventListener('pagehide', function () {
            if (!canvasToken) return;
            try {
                var payload = JSON.stringify({ action: 'release', currentUser: currentUsername, token: canvasToken });
                var blob = new Blob([payload], { type: 'text/plain;charset=utf-8' });
                navigator.sendBeacon(CANVAS_URL, blob);
            } catch (e) {}
        });

        /* ========== 提交统计（自动带上画作） ========== */
        submitBtn.addEventListener('click', async function () {
            var checked = document.querySelectorAll('.q-chip input:checked');
            var selected = [];
            for (var i = 0; i < checked.length; i++) {
                selected.push({
                    group: checked[i].getAttribute('data-group'),
                    question: checked[i].value
                });
            }

            submitBtn.disabled = true;
            var oldText = submitBtn.textContent;
            submitBtn.textContent = '提交中…';

            // 如果正在画画，先自动保存画作
            var artResult = { saved: false, err: '' };
            if (canvasToken) artResult = await saveCanvas(true);

            try {
                var res = await apiCall({
                    action: 'submit',
                    currentUser: currentUsername,
                    selected: selected,
                    displayName: safeGet('displayName') || displayNameOf(currentUsername)
                });
                var data = await res.json().catch(function () { return {}; });
                if (!res.ok || !data.ok) throw new Error(data.msg || ('提交失败：' + res.status));

                hasSubmitted = true;
                submitBtn.textContent = '💾 更新提交';
                savedTip.style.display = 'block';
                savedTip.textContent = '✅ 已保存，更新后会覆盖原记录。';

                var byGroup = {};
                selected.forEach(function (s) {
                    if (!byGroup[s.group]) byGroup[s.group] = [];
                    byGroup[s.group].push(s.question);
                });
                resultBody.innerHTML = '';
                SURVEY_DATA.groups.forEach(function (g) {
                    var qs = byGroup[g.id];
                    if (!qs || !qs.length) return;
                    var row = el('div', 'result-group');
                    row.appendChild(el('div', 'result-group-name', g.name));
                    var chips = el('div', 'result-chips');
                    qs.forEach(function (q) { chips.appendChild(el('span', 'result-chip', q)); });
                    row.appendChild(chips);
                    resultBody.appendChild(row);
                });
                if (!resultBody.children.length) resultBody.appendChild(el('div', 'empty-hint', '本次没有勾选任何薄弱题号。'));

                if (artResult.saved) {
                    canvasSetStatus('✅', '统计和画作都已保存，其他同学现在可以创作了。', false, false);
                } else if (artResult.err) {
                    canvasSetStatus('⚠️', '统计已保存，但画作保存失败：' + artResult.err, false, true);
                }
                resultModal.classList.add('show');
            } catch (err) {
                alert('❌ 提交失败：' + err.message);
                submitBtn.textContent = oldText;
            } finally {
                updateCount();
            }
        });

        /* ========== 彩蛋 7：清晨 / 深夜刷题 ========== */
        var egg7Modal = document.getElementById('egg7Modal');
        var egg7Shown = false;

        document.getElementById('closeEgg7Btn').addEventListener('click', function () {
            egg7Modal.classList.remove('show');
        });
        egg7Modal.addEventListener('click', function (e) {
            if (e.target === egg7Modal) egg7Modal.classList.remove('show');
        });
        document.getElementById('copyEgg7Btn').addEventListener('click', function () {
            var text = document.getElementById('egg7Code').textContent;
            var btn = this;
            var done = function () {
                btn.textContent = '✅ 已复制';
                setTimeout(function () { btn.textContent = '复制'; }, 1500);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy7(text, btn, done); });
            } else {
                fallbackCopy7(text, btn, done);
            }
        });
        function fallbackCopy7(text, btn, done) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); done(); }
            catch (e) { alert('复制失败，请手动复制：' + text); }
            document.body.removeChild(ta);
        }

        function checkEgg7() {
            if (egg7Shown) return;
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            // 7:00 以前，或 22:30 以后（含 22:30）
            if (!(h < 7 || h > 22 || (h === 22 && m >= 30))) return;

            egg7Shown = true;
            var early = h < 7;
            document.getElementById('egg7Emoji').textContent = early ? '🌅' : '🌙';
            document.getElementById('egg7Desc').innerHTML =
                (early ? '一大早就' : '这么晚了还') + '在刷题，真是刻苦学习！这是你的专属兑换码，请前往 <a href="https://pillager-outpost.github.io/2901space/eggs.html" target="_blank">eggs.html</a> 兑换：<br>集齐 9 个彩蛋会触发神秘事件！';
            setTimeout(function () { egg7Modal.classList.add('show'); }, 600);
        }

        /* ========== 初始化 ========== */
        (async function init() {
            if (!(await checkAccess())) return;
            await loadConfig();
            await loadMyResponse();
            await initCanvas();
            checkEgg7();
        })();
    </script>
</body>
</html>
