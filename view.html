<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画布一览 · 2901 Space</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
<style>
    :root {
        --bg1: #E0F2FE; --bg2: #F0FDF4;
        --card: rgba(255, 255, 255, 0.9);
        --text: #1E293B; --text-muted: #64748B;
        --border: rgba(203, 213, 225, 0.6);
        --accent: #0EA5E9; --btn-bg: #0EA5E9; --btn-text: #fff;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        --bg-hover: #f8fafc; --input-bg: rgba(255, 255, 255, 0.5);
        --highlight-bg: #BAE6FD; --highlight-text: #0369A1;
        --err: #c62828; --t-color: 0.3s ease-out;
    }
    html[data-theme="dark"] {
        --bg1: #0B1120; --bg2: #111827;
        --card: rgba(30, 41, 59, 0.9);
        --text: #E2E8F0; --text-muted: #94A3B8;
        --border: rgba(51, 65, 85, 0.8);
        --accent: #38BDF8; --btn-bg: #38BDF8; --btn-text: #0B1120;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        --bg-hover: #1e293b; --input-bg: rgba(255, 255, 255, 0.06);
        --highlight-bg: #0C4A6E; --highlight-text: #7DD3FC; --err: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        background: linear-gradient(160deg, var(--bg1), var(--bg2));
        background-attachment: fixed; color: var(--text);
        font-family: "华文中宋", "STZhongsong", "SimSun", serif;
        line-height: 1.8; min-height: 100vh; padding: 88px 20px 48px;
        transition: background var(--t-color), color var(--t-color); overflow-x: hidden;
    }
    .container { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; animation: fadeUp 0.5s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .back-home {
        position: fixed; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 6px;
        padding: 10px 18px; font-size: 0.95em; font-family: inherit; color: var(--text); background: var(--card);
        border: 1px solid var(--border); border-radius: 12px; text-decoration: none; box-shadow: var(--shadow);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        transition: background 0.2s, transform 0.15s, color 0.2s, border-color 0.2s; z-index: 1000;
    }
    .back-home:hover { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); transform: translateY(-2px); }
    #themeToggle {
        position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%;
        border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1.2em;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        box-shadow: var(--shadow); backdrop-filter: blur(8px);
        transition: background 0.2s, transform 0.2s, border-color 0.2s; z-index: 999;
    }
    #themeToggle:hover { transform: scale(1.08); border-color: var(--accent); }
    .card {
        background: var(--card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border); border-radius: 18px; padding: 26px 28px; box-shadow: var(--shadow);
        transition: background var(--t-color), border-color var(--t-color), box-shadow 0.3s;
    }
    .page-header { text-align: center; margin-bottom: 6px; }
    .page-header h1 { font-size: 2em; font-weight: normal; line-height: 1.3; margin-bottom: 4px; }
    .page-header .sub { font-size: 1em; color: var(--text-muted); letter-spacing: 0.04em; }
    .highlight {
        background: var(--highlight-bg); background-repeat: no-repeat; background-size: 100% 40%;
        background-position: 0 88%; padding: 0 8px; color: var(--highlight-text);
        transition: background var(--t-color), color var(--t-color);
    }
    .section-title {
        font-size: 1.05em; font-weight: normal; color: var(--accent); letter-spacing: 0.1em;
        margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;
        flex-wrap: wrap; gap: 10px; transition: color var(--t-color);
    }
    .status {
        display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
        font-size: 0.95em; color: var(--text-muted); margin-bottom: 14px; text-align: center;
    }
    .stage {
        width: 100%; aspect-ratio: 3 / 2; border: 1px solid var(--border); border-radius: 14px;
        background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #art {
        display: block; width: 100%; height: 100%; object-fit: contain;
        -webkit-user-drag: none; user-select: none; -webkit-user-select: none;
        pointer-events: none;
    }
    .empty { font-size: 1em; color: var(--text-muted); text-align: center; padding: 40px 20px; }
    .admin-bar { display: none; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        padding: 10px 22px; font-size: 0.96em; font-family: inherit; color: var(--btn-text);
        background: var(--btn-bg); border: none; border-radius: 10px; cursor: pointer;
        transition: transform 0.15s, opacity 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn.danger { background: var(--err); }
    .tip { font-size: 0.82em; color: var(--text-muted); text-align: center; margin-top: 14px; }
    .denied-card { text-align: center; padding: 48px 28px; }
    .denied-icon { font-size: 3em; display: block; margin-bottom: 12px; }
    .denied-title { font-size: 1.5em; font-weight: normal; margin-bottom: 10px; }
    .denied-desc { color: var(--text-muted); margin-bottom: 24px; }
    .btn-link { display: inline-block; padding: 10px 24px; color: var(--btn-text); background: var(--btn-bg); border-radius: 10px; text-decoration: none; }
    @media (max-width: 600px) {
        body { padding: 76px 14px 32px; }
        .card { padding: 20px 18px; }
        .page-header h1 { font-size: 1.6em; }
        .back-home { top: 12px; left: 12px; padding: 8px 14px; font-size: 0.85em; }
        #themeToggle { top: 12px; right: 12px; width: 38px; height: 38px; font-size: 1em; }
        .btn { flex: 1; }
    }
</style>
</head>
<body>

    <a class="back-home" href="https://pillager-outpost.github.io/2901space/survey.html" title="返回错题统计"><span>←</span> 返回</a>
    <button id="themeToggle" title="切换深色/浅色模式">🌙</button>

    <div class="container">

        <div class="card">
            <div class="page-header">
                <h1>🖼️ <span class="highlight">画布一览</span></h1>
                <p class="sub">自由发挥区的当前作品 · 仅供观看</p>
            </div>
        </div>

        <div class="card">
            <h2 class="section-title">
                <span>🎨 当前画布</span>
                <button class="mini-btn" id="refreshBtn" style="font-size:0.78em;font-family:inherit;letter-spacing:0;padding:3px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-muted);">🔄 刷新</button>
            </h2>
            <div class="status" id="statusBox">
                <span id="statusIcon">⏳</span>
                <span id="statusText">正在加载画布…</span>
            </div>
            <div class="stage" id="stage">
                <img id="art" alt="当前画布作品" style="display:none;" draggable="false">
                <div class="empty" id="emptyHint" style="display:none;">画布还是空白的，等同学来创作吧～</div>
            </div>

            <div class="admin-bar" id="adminBar">
                <button type="button" class="btn" id="downloadBtn">⬇️ 下载画作</button>
                <button type="button" class="btn danger" id="clearBtn">🧹 清空画布</button>
            </div>

            <p class="tip">本页仅供观看，画面会定时自动更新。</p>
        </div>

    </div>

    <script>
        function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }

        var LOGIN_URL = 'https://pillager-outpost.github.io/2901space/login.html';
        var SUPABASE_URL = 'https://htufjnhmowvfocwukrft.supabase.co';
        var ANON_KEY     = 'sb_publishable_X5i03Y12PA5L71QARR9TIw_6FOlJpVr';
        var GET_USER_URL = SUPABASE_URL + '/functions/v1/get_user';
        var CANVAS_URL   = SUPABASE_URL + '/functions/v1/canvas';

        var token = safeGet('token');
        var currentUsername = safeGet('username');
        var currentLevel = '';
        var lastImage = '';

        /* ========== 禁止右键 / 另存 / 拖拽 ========== */
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        document.addEventListener('dragstart', function (e) { e.preventDefault(); });
        document.addEventListener('keydown', function (e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) e.preventDefault();
        });

        /* ========== 主题 ========== */
        var root = document.documentElement;
        var themeToggle = document.getElementById('themeToggle');
        function applyTheme(t) { root.setAttribute('data-theme', t); themeToggle.textContent = t === 'dark' ? '☀️' : '🌙'; }
        (function () {
            var s = safeGet('theme');
            if (s !== 'dark' && s !== 'light') {
                try { s = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
                catch (e) { s = 'light'; }
            }
            applyTheme(s);
        })();
        themeToggle.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            try { localStorage.setItem('theme', next); } catch (e) {}
        });

        function canvasApi(body) {
            return fetch(CANVAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
                body: JSON.stringify(body)
            }).then(function (r) { return r.json().catch(function () { return {}; }); });
        }
        function formatTime(s) {
            var d = new Date(s);
            if (isNaN(d.getTime())) return s || '—';
            return d.toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false });
        }
        function showDenied(msg) {
            var container = document.querySelector('.container');
            container.innerHTML = '';
            var card = document.createElement('div');
            card.className = 'card denied-card';
            card.innerHTML = '<span class="denied-icon">🔒</span><h1 class="denied-title">无法访问</h1>';
            var p = document.createElement('p'); p.className = 'denied-desc'; p.textContent = msg;
            card.appendChild(p);
            container.appendChild(card);
        }
        async function checkAccess() {
            if (!token || !currentUsername) { location.href = LOGIN_URL; return false; }
            try {
                var res = await fetch(GET_USER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
                    body: JSON.stringify({ username: currentUsername })
                });
                var data = await res.json();
                if (res.ok && data.ok && ['student', 'admin'].indexOf(data.level) !== -1) {
                    currentLevel = data.level;
                    if (currentLevel === 'admin') document.getElementById('adminBar').style.display = 'flex';
                    return true;
                }
                showDenied('当前页面仅学生 / 管理员可观看，你的身份为 ' + (data.level || '未知') + '。');
            } catch (e) { showDenied('身份校验失败，请刷新重试。'); }
            return false;
        }

        /* ========== 加载画布 ========== */
        var art = document.getElementById('art');
        var emptyHint = document.getElementById('emptyHint');
        var statusIcon = document.getElementById('statusIcon');
        var statusText = document.getElementById('statusText');
        var refreshBtn = document.getElementById('refreshBtn');

        async function loadArt() {
            refreshBtn.disabled = true;
            try {
                var d = await canvasApi({ action: 'state' });
                if (!d.ok) throw new Error(d.msg || '加载失败');

                lastImage = d.image || '';
                if (lastImage) {
                    if (art.src !== lastImage) art.src = lastImage;
                    art.style.display = 'block';
                    emptyHint.style.display = 'none';
                    statusIcon.textContent = d.status === 'busy' ? '🎨' : '🖼️';
                    statusText.textContent = (d.status === 'busy'
                        ? '画布正在被 ' + (d.holderName || '某位同学') + ' 使用 · '
                        : '') + '最后更新：' + formatTime(d.updatedAt) + (d.updatedBy ? ' · ' + d.updatedBy : '');
                } else {
                    art.style.display = 'none';
                    emptyHint.style.display = 'block';
                    statusIcon.textContent = '✨';
                    statusText.textContent = d.status === 'busy'
                        ? '画布正在被 ' + (d.holderName || '某位同学') + ' 使用'
                        : '画布还是空白的';
                }
            } catch (err) {
                statusIcon.textContent = '❌';
                statusText.textContent = '加载失败：' + err.message;
            } finally {
                refreshBtn.disabled = false;
            }
        }
        refreshBtn.addEventListener('click', loadArt);

        /* ========== 管理员操作 ========== */
        document.getElementById('downloadBtn').addEventListener('click', function () {
            if (!lastImage) { alert('画布还是空白的'); return; }
            var a = document.createElement('a');
            a.href = lastImage;
            var d = new Date();
            var stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0')
                      + '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
            a.download = '自由发挥区_' + stamp + '.webp';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        document.getElementById('clearBtn').addEventListener('click', async function () {
            if (!confirm('确定清空画布吗？当前作品会被清除，无法恢复。')) return;
            var btn = this;
            btn.disabled = true;
            try {
                var r = await canvasApi({ action: 'reset', currentUser: currentUsername });
                if (!r.ok) throw new Error(r.msg || '清除失败');
                await loadArt();
                alert('画布已清空');
            } catch (err) {
                alert('❌ ' + err.message);
            } finally {
                btn.disabled = false;
            }
        });

        /* ========== 初始化 ========== */
        (async function init() {
            if (!(await checkAccess())) return;
            await loadArt();
            setInterval(loadArt, 10000);
        })();
    </script>
</body>
</html>
