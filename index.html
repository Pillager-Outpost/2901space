<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2901 Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #E5FBFF;
            font-family: "华文中宋", "STZhongsong", "SimSun", serif;
            color: #222;
            line-height: 1.8;
            padding: 40px 20px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        /* 主标题 */
        .hero {
            text-align: center;
            font-size: 2.6em;
            margin-bottom: 30px;
            font-weight: normal;
            line-height: 1.4;
        }

        .highlight {
            color: #EE0000;
            background: #D9D9D9;
            padding: 0 10px;
            border-radius: 4px;
        }

        /* 副标题 */
        .subtitle {
            font-size: 1.8em;
            margin-bottom: 40px;
        }

        /* 分节标题 */
        .section-title {
            font-size: 2em;
            padding-bottom: 8px;
            border-bottom: 1.5px solid #333;
            margin: 50px 0 20px;
            font-weight: normal;
        }

        /* 正文段落 */
        p {
            font-size: 1.15em;
            margin-bottom: 12px;
        }

        /* 链接 */
        a {
            color: #222;
            text-decoration: none;
            border-bottom: 1px dashed #999;
        }

        a:hover {
            color: #EE0000;
            border-bottom-color: #EE0000;
        }

        /* 条款列表 */
        .clause {
            margin-bottom: 30px;
        }

        .clause h3 {
            font-size: 1.3em;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .clause ol {
            list-style: none;
            padding-left: 0;
        }

        .clause ol li {
            font-size: 1.1em;
            margin-bottom: 8px;
            padding-left: 1.8em;
            position: relative;
        }

        .clause ol li::before {
            content: attr(data-num);
            position: absolute;
            left: 0;
        }

        /* 页脚 */
        .footer {
            margin-top: 70px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
            color: #666;
            font-size: 1em;
        }

        /* 响应式：手机适配 */
        @media (max-width: 600px) {
            body { padding: 24px 14px; }
            .hero { font-size: 1.8em; }
            .subtitle { font-size: 1.3em; }
            .section-title { font-size: 1.5em; }
            p { font-size: 1em; }
            .clause h3 { font-size: 1.1em; }
            .clause ol li { font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- 主标题 -->
        <h1 class="hero">欢迎来到 <span class="highlight">2901 Space</span>！</h1>
        <p class="subtitle">2901，好！</p>

        <!-- 宣传栏 -->
        <h2 class="section-title">宣传栏</h2>

        <p>-《生物错题统计自由发挥区公约》（2026.9.18）</p>

        <div class="clause">
            <h3>（一）要求</h3>
            <ol>
                <li data-num="1.">请遵守法律。</li>
                <li data-num="2.">请不要给他人起绰号。</li>
                <li data-num="3.">请文明用语。</li>
            </ol>
        </div>

        <div class="clause">
            <h3>（二）处罚</h3>
            <ol>
                <li data-num="1.">违反第（一）1条的，以后移除所有自由发挥区。</li>
                <li data-num="2.">违反第（一）2条的，自由发挥区禁止违规者发挥 7 天。</li>
                <li data-num="3.">违反第（一）3条的，自由发挥区移除 7 天。</li>
            </ol>
        </div>

        <p>-运动会</p>
        <p>祝大家<span class="highlight">运动会</span>项目顺利！</p>

        <!-- 链接 -->
        <h2 class="section-title">链接</h2>

        <p>生物错题统计一览（未完成）</p>
        <p>2901 图库（未完成）</p>
        <p><a href="https://github.com/Pillager-Outpost/2901space/issues/1" title="点击前往">反馈问题 &amp; 建议</a></p>

        <!-- 页脚 -->
        <div class="footer">
            <p>页面版本：v1</p>
            <p>制作：刘智中</p>
        </div>

    </div>
</body>
</html>
