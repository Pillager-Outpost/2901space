<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 2901 Space</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
<style>
    :root {
        --bg1: #E0F2FE;
        --bg2: #F0FDF4;
        --card: rgba(255, 255, 255, 0.9);
        --text: #1E293B;
        --text-muted: #64748B;
        --border: rgba(203, 213, 225, 0.6);
        --accent: #0EA5E9;
        --btn-bg: #0EA5E9;
        --btn-text: #fff;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        --modal-overlay: rgba(0, 0, 0, 0.5);

        /* 地面和草木配色 */
        --ground-line: rgba(100, 116, 139, 0.45);
        --grass: rgba(132, 204, 22, 0.65);
        --grass-dark: rgba(101, 163, 13, 0.75);
    }
    html[data-theme="dark"] {
        --bg1: #0B1120;
        --bg2: #111827;
        --card: rgba(30, 41, 59, 0.9);
        --text: #E2E8F0;
        --text-muted: #94A3B8;
        --border: rgba(51, 65, 85, 0.8);
        --accent: #38BDF8;
        --btn-bg: #38BDF8;
        --btn-text: #0B1120;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        --modal-overlay: rgba(0, 0, 0, 0.7);

        --ground-line: rgba(148, 163, 184, 0.5);
        --grass: rgba(74, 222, 128, 0.55);
        --grass-dark: rgba(34, 197, 94, 0.65);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: linear-gradient(160deg, var(--bg1), var(--bg2));
        background-attachment: fixed;
        color: var(--text);
        font-family: "华文中宋", "STZhongsong", "SimSun", serif;
        line-height: 1.8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        transition: background 0.4s, color 0.3s;
        overflow-x: hidden;
    }

    .container {
        max-width: 520px;
        width: 100%;
        text-align: center;
        position: relative;
        z-index: 10;
    }

    /* ========== 场景 ========== */
    .scene {
        position: relative;
        height: 170px;
        margin-bottom: 24px;
        overflow: hidden;
    }

    /* 木桩 */
    .stump {
        position: absolute;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        width: 84px;
        height: 84px;
        animation: roll 2.4s linear infinite;
        z-index: 3;
    }
    .stump svg {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.08));
    }
    @keyframes roll {
        from { transform: translateX(-50%) rotate(0deg); }
        to   { transform: translateX(-50%) rotate(360deg); }
    }

    /* 地面 */
    .ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 28px;
        height: 12px;
        z-index: 1;
        overflow: hidden;
    }
    .ground-line {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 200%;
        height: 100%;
        animation: groundMove 3s linear infinite;
    }
    .ground-line svg {
        display: block;
        width: 50%;
        height: 100%;
        float: left;
    }
    @keyframes groundMove {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
    }

    /* 草丛 */
    .grass-layer {
        position: absolute;
        left: 0;
        bottom: 30px;
        width: 300%;
        height: 40px;
        z-index: 2;
        pointer-events: none;
        animation: grassMove 6s linear infinite;
    }
    @keyframes grassMove {
        from { transform: translateX(0); }
        to   { transform: translateX(-180px); }
    }
    .tuft {
        position: absolute;
        bottom: 0;
        width: 26px;
        height: 28px;
    }
    .tuft svg { width: 100%; height: 100%; display: block; }

    /* 草丛位置：每 60px 错开 */
    .tuft:nth-child(1)  { left: 10px;  transform: scale(0.9); }
    .tuft:nth-child(2)  { left: 70px;  transform: scale(1.1); }
    .tuft:nth-child(3)  { left: 130px; transform: scale(0.8); }
    .tuft:nth-child(4)  { left: 190px; transform: scale(1); }
    .tuft:nth-child(5)  { left: 250px; transform: scale(1.15); }
    .tuft:nth-child(6)  { left: 310px; transform: scale(0.9); }
    .tuft:nth-child(7)  { left: 370px; transform: scale(1.05); }
    .tuft:nth-child(8)  { left: 430px; transform: scale(0.85); }
    .tuft:nth-child(9)  { left: 490px; transform: scale(1); }
    .tuft:nth-child(10) { left: 550px; transform: scale(1.1); }
    .tuft:nth-child(11) { left: 610px; transform: scale(0.9); }
    .tuft:nth-child(12) { left: 670px; transform: scale(1.05); }
    .tuft:nth-child(13) { left: 730px; transform: scale(0.8); }
    .tuft:nth-child(14) { left: 790px; transform: scale(1); }
    .tuft:nth-child(15) { left: 850px; transform: scale(1.1); }

    /* ========== 文字与按钮 ========== */
    .code {
        font-size: 4.5em;
        font-weight: normal;
        line-height: 1;
        color: var(--accent);
        margin-bottom: 8px;
        letter-spacing: 0.05em;
    }
    .title { font-size: 1.6em; font-weight: normal; margin-bottom: 12px; }
    .desc { font-size: 1em; color: var(--text-muted); margin-bottom: 36px; }

    .back {
        display: inline-block;
        padding: 12px 32px;
        font-size: 1em;
        font-family: inherit;
        color: var(--btn-text);
        background: var(--btn-bg);
        border: none;
        border-radius: 10px;
        text-decoration: none;
        box-shadow: 0 4px 14px rgba(14, 165, 233, 0.25);
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .back:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(14, 165, 233, 0.35);
    }

    #themeToggle {
        position: fixed;
        top: 20px; right: 20px;
        width: 44px; height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 1.2em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
        transition: background 0.2s, transform 0.2s;
        z-index: 999;
    }
    #themeToggle:hover { transform: scale(1.08); }

    /* ========== 彩蛋弹窗 ========== */
    .modal-overlay {
        position: fixed; inset: 0;
        background: var(--modal-overlay); backdrop-filter: blur(4px);
        display: none; align-items: center; justify-content: center;
        z-index: 1000; opacity: 0; transition: opacity 0.3s ease; padding: 24px;
    }
    .modal-overlay.show { display: flex; opacity: 1; }

    .modal-box {
        background: var(--card); backdrop-filter: blur(12px);
        border: 1px solid var(--border); border-radius: 18px;
        padding: 32px 28px; width: 100%; max-width: 420px;
        text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .egg-emoji { font-size: 3em; margin-bottom: 12px; display: block; }
    .egg-title { font-size: 1.4em; color: var(--accent); margin-bottom: 10px; }
    .egg-desc { font-size: 0.95em; color: var(--text-muted); margin-bottom: 20px; text-align: left; line-height: 1.7; }
    .egg-desc a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); }
    .egg-code-row {
        display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 24px;
    }
    .egg-code {
        font-family: "Consolas", "Courier New", monospace;
        font-size: 1em; color: var(--text);
        background: rgba(255,255,255,0.5); padding: 10px 16px;
        border-radius: 10px; border: 1px dashed var(--accent); user-select: all;
    }
    html[data-theme="dark"] .egg-code { background: rgba(0,0,0,0.2); }
    
    .btn-copy {
        padding: 8px 16px; font-size: 0.9em; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--border); background: transparent; color: var(--text);
        transition: 0.2s;
    }
    .btn-copy:hover { background: var(--bg-hover); }
    .btn-close {
        padding: 10px; font-size: 1em; width: 100%; border-radius: 8px; cursor: pointer;
        background: var(--btn-bg); color: var(--btn-text); border: none; transition: 0.2s;
    }
    .btn-close:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3); }

    @media (max-width: 600px) {
        .scene { height: 140px; }
        .stump { width: 66px; height: 66px; bottom: 28px; }
        .ground { bottom: 24px; }
        .grass-layer { bottom: 24px; height: 34px; }
        .code { font-size: 3.4em; }
        .title { font-size: 1.3em; }
        .desc { font-size: 0.95em; }
        #themeToggle { top: 14px; right: 14px; width: 38px; height: 38px; font-size: 1em; }
    }
</style>
</head>

    <script>
        function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
        function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

        // 主题切换
        var themeToggle = document.getElementById('themeToggle');
        var root = document.documentElement;
        function applyTheme(t) {
            root.setAttribute('data-theme', t);
            if (themeToggle) themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
        }
        function getInitialTheme() {
            var s = safeGet('theme');
            if (s === 'dark' || s === 'light') return s;
            try { return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
            catch(e){ return 'light'; }
        }
        applyTheme(getInitialTheme());
        if (themeToggle) {
            themeToggle.addEventListener('click', function () {
                var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                applyTheme(next);
                safeSet('theme', next);
            });
        }

        // ========== 彩蛋 3 触发逻辑 ==========
        var visitCount = parseInt(safeGet('404_visit_count') || '0', 10) + 1;
        safeSet('404_visit_count', visitCount);

        // 如果进入次数超过等于 10 次，且还没弹过
        if (visitCount >= 10 && !safeGet('404_egg_unlocked')) {
            safeSet('404_egg_unlocked', 'true');
            // 延时 1 秒弹窗，让 404 页面先加载一下
            setTimeout(function() {
                document.getElementById('eggModal').classList.add('show');
            }, 1000);
        }

        // 关闭弹窗与复制逻辑
        var eggModal = document.getElementById('eggModal');
        var closeBtn = document.getElementById('closeBtn');
        var copyBtn = document.getElementById('copyBtn');
        var eggCode = document.getElementById('eggCode');

        closeBtn.addEventListener('click', function() {
            eggModal.classList.remove('show');
        });

        copyBtn.addEventListener('click', function() {
            var text = eggCode.textContent;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(function() {
                    copyBtn.textContent = '已复制';
                    setTimeout(function() { copyBtn.textContent = '复制'; }, 1500);
                });
            } else {
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                copyBtn.textContent = '已复制';
                setTimeout(function() { copyBtn.textContent = '复制'; }, 1500);
            }
        });
    </script>
