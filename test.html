<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase 连通测试 · 2901 Space</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<style>
    :root {
        --bg1: #E0F2FE;
        --bg2: #F0FDF4;
        --card: rgba(255, 255, 255, 0.9);
        --text: #1E293B;
        --text-muted: #64748B;
        --border: rgba(203, 213, 225, 0.6);
        --accent: #0EA5E9;
        --btn-bg: #0EA5E9;
        --btn-text: #fff;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        --shadow-hover: 0 12px 32px rgba(14, 165, 233, 0.15);
        --bg-hover: #f8fafc;
        --input-bg: rgba(255, 255, 255, 0.5);
        --highlight-bg: #BAE6FD;
        --highlight-text: #0369A1;
        --ok: #0a7d32;
        --warn: #b45309;
        --err: #c62828;
        --err-contrast: #fff;
        --t-color: 0.3s ease-out;
    }
    html[data-theme="dark"] {
        --bg1: #0B1120;
        --bg2: #111827;
        --card: rgba(30, 41, 59, 0.9);
        --text: #E2E8F0;
        --text-muted: #94A3B8;
        --border: rgba(51, 65, 85, 0.8);
        --accent: #38BDF8;
        --btn-bg: #38BDF8;
        --btn-text: #0B1120;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        --shadow-hover: 0 12px 32px rgba(56, 189, 248, 0.2);
        --bg-hover: #1e293b;
        --input-bg: rgba(255, 255, 255, 0.06);
        --highlight-bg: #0C4A6E;
        --highlight-text: #7DD3FC;
        --ok: #4ade80;
        --warn: #fbbf24;
        --err: #f87171;
        --err-contrast: #1a1208;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
        background: linear-gradient(160deg, var(--bg1), var(--bg2));
        background-attachment: fixed;
        color: var(--text);
        font-family: "华文中宋", "STZhongsong", "SimSun", serif;
        line-height: 1.8;
        min-height: 100vh;
        padding: 88px 20px 48px;
        transition: background var(--t-color), color var(--t-color);
        overflow-x: hidden;
    }

    .container {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ========== 顶部返回 / 主题 ========== */
    .back-home {
        position: fixed; top: 20px; left: 20px;
        display: inline-flex; align-items: center; gap: 6px;
        padding: 10px 18px; font-size: 0.95em; font-family: inherit;
        color: var(--text); background: var(--card);
        border: 1px solid var(--border); border-radius: 12px;
        text-decoration: none; box-shadow: var(--shadow);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        transition: background 0.2s, transform 0.15s, color 0.2s, border-color 0.2s;
        z-index: 1000;
    }
    .back-home:hover {
        background: var(--btn-bg); color: var(--btn-text);
        border-color: var(--btn-bg); transform: translateY(-2px);
    }
    #themeToggle {
        position: fixed; top: 20px; right: 20px;
        width: 44px; height: 44px; border-radius: 50%;
        border: 1px solid var(--border); background: var(--card);
        color: var(--text); font-size: 1.2em; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        box-shadow: var(--shadow); backdrop-filter: blur(8px);
        transition: background 0.2s, transform 0.2s, border-color 0.2s;
        z-index: 999;
    }
    #themeToggle:hover { transform: scale(1.08); border-color: var(--accent); }

    /* ========== 卡片 ========== */
    .card {
        background: var(--card);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border); border-radius: 18px;
        padding: 26px 28px; box-shadow: var(--shadow);
        transition: background var(--t-color), border-color var(--t-color), box-shadow 0.3s;
    }
    .page-header { text-align: center; margin-bottom: 6px; }
    .page-header h1 { font-size: 2em; font-weight: normal; line-height: 1.3; margin-bottom: 4px; }
    .page-header .sub { font-size: 1em; color: var(--text-muted); letter-spacing: 0.04em; }
    .highlight {
        background: var(--highlight-bg); background-repeat: no-repeat;
        background-size: 100% 40%; background-position: 0 88%;
        padding: 0 8px; color: var(--highlight-text);
        transition: background var(--t-color), color var(--t-color);
    }
    .section-title {
        font-size: 1.05em; font-weight: normal; color: var(--accent);
        letter-spacing: 0.2em; margin-bottom: 18px;
        display: flex; align-items: center; justify-content: space-between;
        transition: color var(--t-color);
    }
    code {
        font-family: "Consolas", "Courier New", monospace;
        background: var(--bg-hover); padding: 1px 6px; border-radius: 6px;
        font-size: 0.95em;
    }

    /* ========== 按钮 ========== */
    .test-actions {
        display: flex; gap: 12px; justify-content: center;
        flex-wrap: wrap; margin-top: 18px;
    }
    .submit-btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 11px 26px; font-size: 1em; font-family: inherit;
        color: var(--btn-text); background: var(--btn-bg);
        border: none; border-radius: 10px; cursor: pointer;
        box-shadow: 0 4px 14px rgba(14, 165, 233, 0.25);
        transition: transform 0.2s, box-shadow 0.2s, background var(--t-color), opacity 0.2s;
    }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(14, 165, 233, 0.35); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .refresh-btn {
        font-size: 0.8em; font-family: inherit; letter-spacing: 0;
        padding: 4px 12px; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--border); background: transparent; color: var(--text-muted);
        transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .refresh-btn:hover { background: var(--bg-hover); color: var(--accent); border-color: var(--accent); }
    .form-msg { font-size: 0.98em; min-height: 1.5em; margin-top: 10px; text-align: center; }
    .form-msg.ok { color: var(--ok); }
    .form-msg.err { color: var(--err); }

    /* ========== 结果条目（复用通知板样式） ========== */
    .notice-list { display: flex; flex-direction: column; gap: 14px; }
    .notice-item {
        border: 1px solid var(--border); border-radius: 14px;
        padding: 16px 18px; background: var(--input-bg);
        transition: border-color 0.2s, transform 0.15s, background var(--t-color);
    }
    .notice-item:hover { border-color: var(--accent); transform: translateY(-2px); }
    .notice-head {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .notice-author {
        font-size: 1.05em; color: var(--accent); font-weight: bold;
        display: inline-flex; align-items: center; gap: 6px;
        transition: color var(--t-color);
    }
    .notice-author .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .notice-text {
        font-size: 1em; white-space: pre-wrap; overflow-wrap: anywhere;
        line-height: 1.75; color: var(--text);
    }
    .empty { text-align: center; color: var(--text-muted); padding: 32px 0; font-size: 1em; }
    .status-badge {
        display: inline-block; padding: 1px 8px;
        font-size: 0.72em; letter-spacing: 0.05em;
        border-radius: 999px; border: 1px solid var(--ok); color: var(--ok);
        white-space: nowrap; vertical-align: middle;
    }
    .status-badge.warn { border-color: var(--warn); color: var(--warn); }
    .status-badge.fail { border-color: var(--err); color: var(--err); }
    .notice-tail { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .notice-time {
        font-size: 0.78em; color: var(--text-muted);
        font-family: "Consolas", "Courier New", monospace;
        white-space: nowrap;
    }

    /* ========== 日志 ========== */
    .log-box {
        max-height: 300px; overflow: auto;
        padding: 14px 16px; font-size: 0.9em; line-height: 1.7;
        color: var(--text-muted); background: var(--input-bg);
        border: 1px solid var(--border); border-radius: 12px;
        white-space: pre-wrap; overflow-wrap: anywhere;
        font-family: "Consolas", "Courier New", monospace;
        transition: background var(--t-color), border-color var(--t-color);
    }

    @media (max-width: 600px) {
        body { padding: 76px 14px 32px; }
        .card { padding: 20px 18px; }
        .page-header h1 { font-size: 1.6em; }
        .page-header .sub { font-size: 0.95em; }
        .back-home { top: 12px; left: 12px; padding: 8px 14px; font-size: 0.85em; }
        #themeToggle { top: 12px; right: 12px; width: 38px; height: 38px; font-size: 1em; }
        .test-actions { flex-direction: column; align-items: stretch; }
        .submit-btn { width: 100%; justify-content: center; }
    }
</style>
</head>
<body>

<a class="back-home" href="https://pillager-outpost.github.io/2901space/home.html" title="返回用户主页">
    <span>←</span> 返回
</a>
<button id="themeToggle" title="切换深色/浅色模式">🌙</button>

<div class="container">

    <div class="card">
        <div class="page-header">
            <h1><span class="highlight">Supabase 服务连通测试</span></h1>
            <p class="sub">
                测试地址：<code>https://htufjnhmowvfocwukrft.supabase.co</code><br>
                <span style="color:var(--warn)">⚠️ = 服务已响应，只是被 RLS / 参数规则拒绝，不算挂；❌ 才是网络或 CDN 不通。</span>
            </p>
        </div>
        <div class="test-actions">
            <button class="submit-btn" id="runBtn">🧪 开始测试</button>
            <button class="refresh-btn" id="copyBtn">复制日志</button>
        </div>
        <p class="form-msg" id="summary">等待测试…</p>
    </div>

    <div class="card">
        <h2 class="section-title"><span>🔍 检测结果</span></h2>
        <div class="notice-list" id="results">
            <div class="empty">正在准备检测…</div>
        </div>
    </div>

    <div class="card">
        <h2 class="section-title"><span>📜 原始日志</span></h2>
        <div class="log-box" id="raw">日志会显示在这里</div>
    </div>

</div>

<script type="module">
const SUPABASE_URL = 'https://htufjnhmowvfocwukrft.supabase.co';
const ANON_KEY     = 'sb_publishable_X5i03Y12PA5L71QARR9TIw_6FOlJpVr';

const CDN_LIST = [
    'https://esm.sh/@supabase/supabase-js@2',
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm',
    'https://unpkg.com/@supabase/supabase-js@2?module'
];

function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

const resultsEl = document.getElementById('results');
const rawEl     = document.getElementById('raw');
const summaryEl = document.getElementById('summary');
const runBtn    = document.getElementById('runBtn');
const copyBtn   = document.getElementById('copyBtn');

/* ========== 主题（和站内其他页面完全一致） ========== */
var root = document.documentElement;
var themeToggle = document.getElementById('themeToggle');
function applyTheme(t) {
    root.setAttribute('data-theme', t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
}
function getInitialTheme() {
    var s = safeGet('theme');
    if (s === 'dark' || s === 'light') return s;
    try { return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    catch(e){ return 'light'; }
}
applyTheme(getInitialTheme());
themeToggle.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    safeSet('theme', next);
});

/* ========== 测试逻辑 ========== */
let logLines = [];
let stats = { ok:0, warn:0, fail:0 };
let stepStart = performance.now();

// 每个测试项开始前重置计时，addItem 自动计算该项耗时
function beginStep(){ stepStart = performance.now(); }

function log(line){
    logLines.push(line);
    rawEl.textContent = logLines.join('\n');
}

function addItem(name, status, msg, detail){
    stats[status]++;
    const ms = Math.max(0, Math.round(performance.now() - stepStart));
    const label = status === 'ok' ? '✅ 正常' : status === 'warn' ? '⚠️ 已响应' : '❌ 失败';
    const div = document.createElement('div');
    div.className = 'notice-item';
    div.innerHTML = `
        <div class="notice-head">
            <span class="notice-author"><span class="dot"></span>${name}</span>
            <span class="notice-tail">
                <span class="notice-time" title="本项耗时">${ms} ms</span>
                <span class="status-badge ${status}">${label}</span>
            </span>
        </div>
        <div class="notice-text">${msg}</div>
    `;
    resultsEl.appendChild(div);
    log(`[${label}] ${name} (${ms} ms) :: ${msg}`);
    if (detail !== undefined && detail !== null){
        let text;
        try { text = JSON.stringify(detail, null, 2); }
        catch { text = String(detail); }
        log('    ' + text.split('\n').join('\n    '));
    }
}

function finish(){
    summaryEl.className = 'form-msg ' + (stats.fail ? 'err' : stats.warn ? '' : 'ok');
    summaryEl.textContent =
        `测试完成：✅ ${stats.ok} 正常　⚠️ ${stats.warn} 已响应　❌ ${stats.fail} 失败` +
        (stats.fail === 0 ? '　—　Supabase 服务可达' : '　—　存在网络/加载问题');
    runBtn.disabled = false;
    runBtn.textContent = '🧪 重新测试';
}

async function run(){
    resultsEl.innerHTML = '';
    logLines = [];
    stats = { ok:0, warn:0, fail:0 };
    rawEl.textContent = '正在测试…';
    summaryEl.className = 'form-msg';
    summaryEl.textContent = '正在测试，请稍候…';
    runBtn.disabled = true;
    runBtn.textContent = '测试中…';

    log('目标 URL: ' + SUPABASE_URL);
    log('时间: ' + new Date().toLocaleString());

    /* 1. 加载 SDK */
    beginStep();
    let createClient = null;
    let usedCdn = '';
    for (const cdn of CDN_LIST){
        try{
            const mod = await import(cdn);
            if (typeof mod.createClient === 'function'){
                createClient = mod.createClient;
                usedCdn = cdn;
                break;
            }
        }catch(e){
            log(`[CDN失败] ${cdn} -> ${e.message}`);
        }
    }

    if (!createClient){
        addItem('Supabase JS SDK', 'fail', '三个 CDN 都加载失败，检查网络或换 CDN。');
        finish();
        return;
    }
    addItem('Supabase JS SDK', 'ok', `已加载：${usedCdn}`);

    const supabase = createClient(SUPABASE_URL, ANON_KEY, {
        auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
    });

    /* 2. PostgREST：notice */
    beginStep();
    try{
        const { data, error, count } = await supabase
            .from('notice')
            .select('*', { count:'exact', head:true })
            .limit(1);

        if (error){
            addItem('数据库 PostgREST', 'warn',
                `请求已到达数据库服务，但被拒绝：${error.message}（常见于 RLS，不代表服务挂了）`,
                { code:error.code, details:error.details, hint:error.hint });
        }else{
            addItem('数据库 PostgREST', 'ok',
                `连接成功，notice 表可访问，count=${count ?? '未返回'}`,
                { count, data });
        }
    }catch(e){
        addItem('数据库 PostgREST', 'fail', '请求异常：' + e.message);
    }

    /* 3. PostgREST：survey_config */
    beginStep();
    try{
        const { data, error } = await supabase
            .from('survey_config')
            .select('id,title')
            .eq('id', 1)
            .maybeSingle();

        if (error){
            addItem('业务表 survey_config', 'warn',
                '服务已响应：' + error.message, error);
        }else{
            addItem('业务表 survey_config', 'ok',
                data ? `读取成功，当前标题：${data.title}` : '服务正常，当前没有 id=1 的配置行',
                data);
        }
    }catch(e){
        addItem('业务表 survey_config', 'fail', '请求异常：' + e.message);
    }

    /* 4. Edge Function：get_user */
    beginStep();
    try{
        const res = await fetch(`${SUPABASE_URL}/functions/v1/get_user`, {
            method:'POST',
            headers:{
                'Content-Type':'application/json',
                'apikey':ANON_KEY,
                'Authorization':`Bearer ${ANON_KEY}`
            },
            body:JSON.stringify({ username:'__supabase_test__' })
        });
        const text = await res.text();
        let body;
        try{ body = JSON.parse(text); }catch{ body = text; }

        if (res.status < 500){
            addItem('Edge Function get_user', 'ok',
                `函数已响应：HTTP ${res.status} ${res.statusText}`, body);
        }else{
            addItem('Edge Function get_user', 'warn',
                `函数已响应但服务端报错：HTTP ${res.status}`, body);
        }
    }catch(e){
        addItem('Edge Function get_user', 'fail',
            '网络/CORS 异常：' + e.message + '（若函数未返回 Access-Control-Allow-Origin，浏览器会拦）');
    }

    /* 5. Auth 服务 */
    beginStep();
    try{
        const { error } = await supabase.auth.signInWithPassword({
            email:'__supabase_test__@example.invalid',
            password:'wrong-password'
        });

        if (error && /invalid|错误|credentials/i.test(error.message)){
            addItem('Auth 服务', 'ok',
                '服务在线（假账号按预期被拒绝）',
                { message:error.message, status:error.status });
        }else if (error){
            addItem('Auth 服务', 'warn', '服务已响应：' + error.message, error);
        }else{
            addItem('Auth 服务', 'warn', '意外登录成功，请检查测试账号', null);
        }
    }catch(e){
        addItem('Auth 服务', 'fail', '请求异常：' + e.message);
    }

    finish();
}

runBtn.addEventListener('click', run);

copyBtn.addEventListener('click', async () => {
    const text = rawEl.textContent || '';
    try{
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = '已复制 ✓';
    }catch{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try{ document.execCommand('copy'); copyBtn.textContent = '已复制 ✓'; }
        catch{ copyBtn.textContent = '复制失败'; }
        document.body.removeChild(ta);
    }
    setTimeout(() => { copyBtn.textContent = '复制日志'; }, 1600);
});

/* 打开即自动跑一次 */
run();
</script>
</body>
</html>
